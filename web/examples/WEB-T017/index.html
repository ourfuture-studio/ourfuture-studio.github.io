<body>
<h1>모의 비동기 상태</h1>
<p>실제 네트워크가 아닌 타이머 모의 응답입니다.</p>
<button id="ok">모의 성공</button>
<button id="fail">모의 실패</button>
<p id="result" role="status">시작 전</p>
<script>
const buttons = [...document.querySelectorAll("button")];
const result = document.querySelector("#result");
function mockRequest(fail) {
  return new Promise((resolve, reject) => {
    setTimeout(() => fail ? reject(new Error("모의 오류")) : resolve("웹 기초"), 600);
  });
}
async function run(fail) {
  buttons.forEach(b => b.disabled = true);
  result.textContent = "불러오는 중";
  try { result.textContent = `성공: ${await mockRequest(fail)}`; }
  catch (error) { result.textContent = `실패: ${error.message}`; }
  finally { buttons.forEach(b => b.disabled = false); }
}
document.querySelector("#ok").addEventListener("click", () => run(false));
document.querySelector("#fail").addEventListener("click", () => run(true));
</script>
