<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹 기초 · 예제 18</title>
</head>
<body>
<h1>강좌 선택 기억</h1>
<p>이 사이트에서 선택한 가상 강좌만 기억합니다.</p>
<label for="course">강좌</label>
<select id="course"><option value="web">웹 기초</option><option value="css">CSS 기초</option></select>
<button id="save">저장</button>
<button id="remove">삭제</button>
<p id="result" role="status"></p>
<script>
const key = "ourfuture.web.course";
const course = document.querySelector("#course");
const result = document.querySelector("#result");
try {
  const saved = localStorage.getItem(key);
  course.value = ["web", "css"].includes(saved) ? saved : "web";
  result.textContent = saved ? "저장값을 읽었습니다" : "저장값 없음";
} catch { result.textContent = "저장소를 사용할 수 없습니다"; }
document.querySelector("#save").addEventListener("click", () => {
  try { localStorage.setItem(key, course.value); result.textContent = "저장했습니다"; }
  catch { result.textContent = "저장에 실패했습니다"; }
});
document.querySelector("#remove").addEventListener("click", () => {
  try { localStorage.removeItem(key); course.value = "web"; result.textContent = "삭제했습니다"; }
  catch { result.textContent = "삭제에 실패했습니다"; }
});
</script>
</body>
</html>
