<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹 기초 · 예제 22</title>
<style>
input { width:110px; max-width:100%; }
</style>
</head>
<body>
<h1>전용 Worker 합 계산</h1>
<p>이 페이지에서 계산을 실행할 수 있습니다.</p>
<label for="n">마지막 정수</label>
<input id="n" type="number" min="1" max="1000000" value="100000">
<button id="calculate">계산</button>
<button id="count">화면 횟수 0</button>
<p id="result" role="status">시작 전</p>
<script>
let worker;
let clicks = 0;
const result = document.querySelector("#result");
document.querySelector("#calculate").addEventListener("click", () => {
  const raw = document.querySelector("#n").value.trim();
  const n = Number(raw);
  if (!raw || !Number.isInteger(n) || n < 1 || n > 1000000) {
    result.textContent = "1~1000000의 정수를 입력하세요"; return;
  }
  if (worker) worker.terminate();
  result.textContent = "계산 중";
  try {
    worker = new Worker("worker.js");
    worker.onmessage = event => { result.textContent = `합: ${event.data}`; worker.terminate(); };
    worker.onerror = event => { event.preventDefault(); result.textContent = "Worker 오류: 경로와 HTTP 실행을 확인하세요"; worker.terminate(); };
    worker.postMessage(n);
  } catch { result.textContent = "Worker를 시작할 수 없습니다"; }
});
document.querySelector("#count").addEventListener("click", event => {
  event.currentTarget.textContent = `화면 횟수 ${++clicks}`;
});
</script>
</body>
</html>
