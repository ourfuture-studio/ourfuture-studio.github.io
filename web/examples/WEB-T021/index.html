<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹 기초 · 예제 21</title>
<style data-site-rights-style="1">.of-rights{box-sizing:border-box;max-width:1100px;margin:24px auto 0;padding:20px 24px 24px;border-top:1px solid #d7d7d2;font-family:inherit;font-size:12px;line-height:1.8;letter-spacing:normal;color:inherit;overflow-wrap:anywhere}.of-rights p{margin:0 0 4px;font-size:12px;line-height:1.8}.of-rights a{color:inherit;text-decoration:underline;text-underline-offset:3px}@media(max-width:600px){.of-rights{padding:18px 20px}}@media print{.of-rights{break-inside:avoid}}</style>
</head>
<body>
<h1>모의 위치 응답</h1>
<p>실제 위치를 요청하지 않습니다. 좌표는 가상 값입니다.</p>
<button id="ok">모의 성공</button>
<button id="deny">권한 거절</button>
<button id="timeout">시간 초과</button>
<p id="result" role="status">시작 전</p>
<script>
const result = document.querySelector("#result");
function showPosition(position) {
  result.textContent = `가상 좌표: ${position.coords.latitude}, ${position.coords.longitude}`;
}
function showError(error) {
  const messages = {1: "권한 거절: 주소를 직접 확인하세요", 2: "위치 사용 불가", 3: "시간 초과: 잠시 뒤 다시 시도하세요"};
  result.textContent = messages[error.code] ?? "알 수 없는 오류";
}
document.querySelector("#ok").addEventListener("click", () => showPosition({coords:{latitude:37,longitude:127}}));
document.querySelector("#deny").addEventListener("click", () => showError({code:1}));
document.querySelector("#timeout").addEventListener("click", () => showError({code:3}));
</script>

</body>
</html>
