<text x="130" y="569" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="600" fill="#8ba89b" text-anchor="middle">09</text>
<circle cx="310" cy="493" r="13" fill="#8ba89b"/><path d="M288 528 Q289 506 310 506 Q331 506 332 528 Z" fill="#8ba89b"/>
<text x="310" y="569" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="600" fill="#8ba89b" text-anchor="middle">10</text>
