<text x="670" y="569" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="600" fill="#8ba89b" text-anchor="middle">12</text>
<path d="M400 650V717" fill="none" stroke="#34776b" stroke-width="4"/><path d="M389 715L400 733L411 715Z" fill="#34776b"/>
<text x="425" y="689" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#203e39" text-anchor="start">표본추출(Sampling)</text>
<rect x="35" y="755" width="730" height="245" rx="15" fill="#fff6eb" stroke="#d3b89f" stroke-width="2"/>
<text x="65" y="802" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#203e39" text-anchor="start">실제로 조사한 일부: 표본(Sample)</text>
<circle cx="170" cy="847.4" r="13.65" fill="#b56a42"/><path d="M146.9 884.15 Q147.95 861.05 170 861.05 Q192.05 861.05 193.1 884.15 Z" fill="#b56a42"/>
<circle cx="170" cy="863.15" r="39.9" fill="none" stroke="#b56a42" stroke-width="3"/>
<text x="170" y="927.2" font-family="Malgun Gothic,sans-serif" font-size="23.1" font-weight="600" fill="#b56a42" text-anchor="middle">03</text>
<circle cx="400" cy="847.4" r="13.65" fill="#b56a42"/><path d="M376.9 884.15 Q377.95 861.05 400 861.05 Q422.05 861.05 423.1 884.15 Z" fill="#b56a42"/>
<circle cx="400" cy="863.15" r="39.9" fill="none" stroke="#b56a42" stroke-width="3"/>
<text x="400" y="927.2" font-family="Malgun Gothic,sans-serif" font-size="23.1" font-weight="600" fill="#b56a42" text-anchor="middle">07</text>
<circle cx="630" cy="847.4" r="13.65" fill="#b56a42"/><path d="M606.9 884.15 Q607.95 861.05 630 861.05 Q652.05 861.05 653.1 884.15 Z" fill="#b56a42"/>
<circle cx="630" cy="863.15" r="39.9" fill="none" stroke="#b56a42" stroke-width="3"/>
<text x="630" y="927.2" font-family="Malgun Gothic,sans-serif" font-size="23.1" font-weight="600" fill="#b56a42" text-anchor="middle">11</text>
<text x="400" y="976" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#7a624f" text-anchor="middle">같은 번호 = 전체 안에 있던 바로 그 항목</text>
<rect x="35" y="1045" width="350" height="210" rx="15" fill="#fff" stroke="#bdd1c5" stroke-width="2"/>
<rect x="415" y="1045" width="350" height="210" rx="15" fill="#fff" stroke="#bdd1c5" stroke-width="2"/>
<text x="60" y="1090" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#203e39" text-anchor="start">모수(Parameter) μ</text>
<text x="60" y="1138" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203e39" text-anchor="start">모집단을 설명하는 값</text>
<text x="60" y="1178" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#5f786d" text-anchor="start">알고 싶지만 아직 모름</text>
<text x="440" y="1090" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#203e39" text-anchor="start">통계량(Statistic) x̄</text>
<text x="440" y="1138" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203e39" text-anchor="start">표본에서 계산한 값</text>
<text x="440" y="1178" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#5f786d" text-anchor="start">조사한 자료로 구함</text>
<text x="400" y="1300" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="400" fill="#34776b" text-anchor="middle">표본의 값과 불확실성을 근거로 전체를 추론</text>
<text x="400" y="1360" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#203e39" text-anchor="middle">표본평균을 구했다고 모평균을 안 것은 아닙니다.</text>
<text x="40" y="1420" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="400" fill="#687b70" text-anchor="start">12개 중 3개를 고른 교육용 도식입니다.</text>
<text x="40" y="1456" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="400" fill="#687b70" text-anchor="start">실제 표본 수와 추출 방법은 예제의 조건을 확인하세요.</text>
</svg>