<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1510" viewBox="0 0 800 1510" role="img"><title>모집단과 표본: 같은 항목이 전체에서 일부로 선택된다</title><desc>모집단을 나타내는 12개 항목 중 03,07,11을 선택해 같은 번호를 표본에 다시 그렸다. 모수는 알고 싶은 전체의 값, 통계량은 표본에서 계산한 값이다.</desc><rect width="800" height="1510" fill="#faf9f4"/>
<text x="40" y="64" font-family="Malgun Gothic,sans-serif" font-size="35" font-weight="700" fill="#203e39" text-anchor="start">전체와 일부의 관계부터 보기</text>
<text x="40" y="107" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="400" fill="#203e39" text-anchor="start">모집단(Population) → 표본(Sample)</text>
<rect x="35" y="145" width="730" height="490" rx="15" fill="#f0f5ee" stroke="#bdd1c5" stroke-width="2"/>
<text x="65" y="190" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#203e39" text-anchor="start">알고 싶은 전체: 모집단(Population)</text>
<text x="65" y="230" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#5f786d" text-anchor="start">주황색 03·07·11을 골랐다고 해 보세요.</text>
