<line x1="270.0" y1="621.3" x2="270.0" y2="706.3" stroke="#dcded7" stroke-width="2" />
<text x="282.0" y="658.5" fill="#1b2340" font-size="26" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">[4, 8, 12]</text>
<line x1="490.0" y1="621.3" x2="490.0" y2="706.3" stroke="#dcded7" stroke-width="2" />
<text x="502.0" y="658.5" fill="#1b2340" font-size="26" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">8</text>
<line x1="710.0" y1="621.3" x2="710.0" y2="706.3" stroke="#dcded7" stroke-width="2" />
<text x="722.0" y="658.5" fill="#1b2340" font-size="26" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">32</text>
<line x1="930.0" y1="621.3" x2="930.0" y2="706.3" stroke="#dcded7" stroke-width="2" />
<text x="942.0" y="658.5" fill="#1b2340" font-size="26" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">16</text>
<text x="50" y="767.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">2·4·6의 평균은4, 편차제곱합은8이다. 두 배한4·8·12의 불편 표본분산은16이다.</text>
<text x="50" y="871.4" fill="#626a73" font-size="20" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">ourfuture studio · 직접 만든 교육용 예제</text>
