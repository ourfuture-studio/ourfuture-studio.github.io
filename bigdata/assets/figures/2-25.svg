<line x1="710.0" y1="451.3" x2="710.0" y2="536.3" stroke="#dcded7" stroke-width="2" />
<text x="722.0" y="488.5" fill="#1b2340" font-size="26" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">편차제곱합</text>
