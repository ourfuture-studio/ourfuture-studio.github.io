lgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="700">편차제곱합</text><text x="66" y="1412" fill="#626a73" font-size="23" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="400">Sum of Squared Deviations</text><rect x="612" y="1344" width="540" height="89" rx="12" fill="#ffffff" stroke="#dcded7" stroke-width="1.5" /><text x="630" y="1379" fill="#1b2340" font-size="25" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="700">모분산</text><text x="630" y="1412" fill="#626a73" font-size="23" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="400">Population Variance</text></svg>