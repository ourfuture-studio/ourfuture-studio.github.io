   <g id="text_1">
    <text style="font-size: 18px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #202944" x="432" y="203.97701" transform="rotate(-0 432 203.97701)">정상 출발 전이행: 정상→정상 0.9 + 정상→마모 0.1 = 1</text>
   </g>
   <g id="text_2">
    <text style="font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #2c6a61" x="211.8528" y="278.568" transform="rotate(-0 211.8528 278.568)">실선: 상태 전이</text>
   </g>
   <g id="text_3">
    <text style="font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #95364e" x="604.9728" y="278.568" transform="rotate(-0 604.9728 278.568)">점선: 관측 방출</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 19px; font-family: 'Malgun Gothic'; fill: #202944" transform="translate(223.319409 365.432449)">시점 1</text>
    <text style="font-weight: 700; font-size: 19px; font-family: 'Malgun Gothic'; fill: #202944" transform="translate(221.245738 385.463347)">정상 N</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 19px; font-family: 'Malgun Gothic'; fill: #202944" transform="translate(608.577009 365.432449)">시점 2</text>
    <text style="font-weight: 700; font-size: 19px; font-family: 'Malgun Gothic'; fill: #202944" transform="translate(604.489041 385.463347)">마모 W</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'Malgun Gothic'; fill: #202944" transform="translate(55.1731 329.575995)">초기 정상</text>
    <text style="font-size: 16px; font-family: 'Malgun Gothic'; fill: #202944" transform="translate(60.6106 346.56912)">확률 0.8</text>
   </g>
   <g id="text_7">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #2c6a61" x="443.7936" y="347.497021" transform="rotate(-0 443.7936 347.497021)">전이 P(W|N)=0.1</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #202944" x="251.1648" y="536.379117" transform="rotate(-0 251.1648 536.379117)">관측: 낮음</text>
   </g>
   <g id="text_9">
    <text style="font-size: 18px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #202944" x="636.4224" y="536.379117" transform="rotate(-0 636.4224 536.379117)">관측: 높음</text>
   </g>
   <g id="text_10">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #95364e" x="266.8896" y="469.97856" transform="rotate(-0 266.8896 469.97856)">방출 0.9</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #95364e" x="652.1472" y="469.97856" transform="rotate(-0 652.1472 469.97856)">방출 0.7</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 18px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #202944" x="432" y="611.01792" transform="rotate(-0 432 611.01792)">지정 경로·관측의 결합확률 = 0.8 × 0.9 × 0.1 × 0.7 = 0.0504</text>
   </g>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 25px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #202944" x="47.52" y="56.047125" transform="rotate(-0 47.52 56.047125)">HMM: 상태 전이와 관측 방출을 나눈다</text>
  </g>
  <g id="text_14">
   <text style="font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #586773" x="47.52" y="94.011" transform="rotate(-0 47.52 94.011)">중앙은 지정 경로 N→W와 관측 낮음→높음만 표시 · 다른 경로는 합산하지 않음</text>
  </g>
  <g id="text_15">
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #586773" x="47.52" y="744.12" transform="rotate(-0 47.52 744.12)">직접 만든 교육용 예제 · 그림은 표시된 고정 조건을 보여 줍니다.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 17px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #202944" x="60.48" y="694.512" transform="rotate(-0 60.48 694.512)">변형: 정상→마모 0.2이면 정상→정상 0.8도 함께 조정 (행합 1)</text>
  </g>
  <g id="text_17">
   <text style="font-size: 17px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #2c6a61" x="60.48" y="721.224" transform="rotate(-0 60.48 721.224)">이 경로의 결합확률은 0.8 × 0.9 × 0.2 × 0.7 = 0.1008</text>
  </g>
 </g>
