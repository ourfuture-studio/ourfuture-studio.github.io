<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1105" viewBox="0 0 1200 1105" role="img">
<rect width="1200" height="1105" fill="#fbfaf6"/>
<text x="50" y="78.7" fill="#1b2340" font-size="44" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">Attention은 가중치를 구해 Value를 합친다</text>
<text x="50" y="146.9" fill="#626a73" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">가중치 계산과 V 집계를 나눈다.</text>
<text x="70" y="222.4" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">Q·K로 정해진 가중치 · 여기서는 이미 주어진 비중</text>
<rect x="110" y="261.3" width="245.0" height="58" rx="0" fill="#2e6b60" stroke="#2e6b60" stroke-width="2"/>
<text x="128" y="295.5" fill="#ffffff" font-size="27" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">가중치 0.25</text>
<rect x="355.0" y="261.3" width="735.0" height="58" rx="0" fill="#8c3444" stroke="#8c3444" stroke-width="2"/>
<text x="373.0" y="295.5" fill="#ffffff" font-size="27" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">가중치 0.75</text>
<text x="160" y="393.2" fill="#2e6b60" font-size="36" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">값 V1 = 2</text>
<line x1="330" y1="423.3" x2="330" y2="485.3" stroke="#2e6b60" stroke-width="4"/>
<line x1="330" y1="485.3" x2="322.80861692093697" y2="472.1362615716444" stroke="#2e6b60" stroke-width="4"/>
<line x1="330" y1="485.3" x2="337.19138307906303" y2="472.1362615716444" stroke="#2e6b60" stroke-width="4"/>
<rect x="110" y="493.3" width="440" height="104" rx="14" fill="#e2efe8" stroke="#dcded7" stroke-width="2"/>
<text x="138" y="549.3" fill="#2e6b60" font-size="34" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">0.25 × 2 = 0.5</text>
<text x="700" y="393.2" fill="#8c3444" font-size="36" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">값 V2 = 6</text>
<line x1="870" y1="423.3" x2="870" y2="485.3" stroke="#8c3444" stroke-width="4"/>
<line x1="870" y1="485.3" x2="862.808616920937" y2="472.1362615716444" stroke="#8c3444" stroke-width="4"/>
<line x1="870" y1="485.3" x2="877.191383079063" y2="472.1362615716444" stroke="#8c3444" stroke-width="4"/>
<rect x="650" y="493.3" width="440" height="104" rx="14" fill="#f3e5e8" stroke="#dcded7" stroke-width="2"/>
<text x="678" y="549.3" fill="#8c3444" font-size="34" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">0.75 × 6 = 4.5</text>
<line x1="330" y1="602.3" x2="480" y2="707.3" stroke="#2e6b60" stroke-width="4"/>
<line x1="480" y1="707.3" x2="465.0918578863937" y2="705.6425022713385" stroke="#2e6b60" stroke-width="4"/>
<line x1="480" y1="707.3" x2="473.33983268586223" y2="693.8596811292406" stroke="#2e6b60" stroke-width="4"/>
<line x1="870" y1="602.3" x2="720" y2="707.3" stroke="#8c3444" stroke-width="4"/>
<line x1="720" y1="707.3" x2="726.6601673141378" y2="693.8596811292406" stroke="#8c3444" stroke-width="4"/>
<line x1="720" y1="707.3" x2="734.9081421136063" y2="705.6425022713385" stroke="#8c3444" stroke-width="4"/>
<circle cx="600" cy="671.3" r="26" fill="#1b2340"/>
<text x="586" y="680.2" fill="#ffffff" font-size="36" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">+</text>
<rect x="350" y="723.3" width="500" height="116" rx="14" fill="#ffffff" stroke="#2e6b60" stroke-width="2"/>
<text x="390" y="777.3" fill="#2e6b60" font-size="34" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">출력 = 0.5 + 4.5 = 5</text>
<text x="85" y="911.4" fill="#1b2340" font-size="29" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">큰 값 하나를 고르는 연산이 아니라 Value의 가중합이다.</text>
<text x="50" y="1000.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">Q와 K가 만든 비중(.25,.75)로 V(2,6)를 합하면5다.</text>
<text x="50" y="1076.4" fill="#626a73" font-size="20" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">ourfuture studio · 직접 만든 교육용 예제</text>
</svg>