<text x="50" y="852.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">10000원은10천원이다. 변환 없이 넣으면20000, 명세대로 바꾸면20을 출력한다.</text>
