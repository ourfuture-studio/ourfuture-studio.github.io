<text x="50" y="1007.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">새 사람 평가에서는 A·B로 훈련하고 C로 시험해 개인의 경계를 지킨다. 미래 예측</text>
