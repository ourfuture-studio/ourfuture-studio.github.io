<text x="722.0" y="658.5" fill="#1b2340" font-size="26" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">0.03</text>
<line x1="930.0" y1="621.3" x2="930.0" y2="706.3" stroke="#dcded7" stroke-width="2" />
<text x="942.0" y="658.5" fill="#1b2340" font-size="26" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">0.375</text>
<text x="50" y="767.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">A의 결합확률.05와 B의.03 중 A몫은.05/.08=.625다.</text>
