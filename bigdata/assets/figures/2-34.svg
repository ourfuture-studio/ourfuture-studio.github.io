<text x="50" y="767.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">비복원은2/5×1/4=0.10, 복원·독립은2/5×2/5=0.16이다.</text>
