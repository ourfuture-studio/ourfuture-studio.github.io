<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1382" viewBox="0 0 1200 1382" role="img" aria-labelledby="terminology-title"><title id="terminology-title">회귀 앙상블(Regression Ensemble)과 평균 결합(Averaging)</title><desc>기존 교육 도표의 수치와 도형을 보존하고 정식 한국어·영문 용어를 덧붙인 자료입니다.</desc><rect width="1200" height="1382" fill="#fbfaf6" /><text x="48" y="38" fill="#626a73" font-size="20" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="400">빅데이터분석기사 · 4-25</text><text x="48" y="86" fill="#1b2340" font-size="34" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="700">회귀 앙상블(Regression Ensemble)과 평균 결합(Averaging)</text><line x1="48" x2="1152" y1="134" y2="134" stroke="#dcded7" stroke-width="2" /><g transform="translate(0 146)"><svg width="1200" height="900" viewBox="0 0 1200 900" role="img" x="0" y="0" overflow="hidden">
<rect width="1200" height="900" fill="#fbfaf6" />
<text x="50" y="78.7" fill="#1b2340" font-size="44" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">융합했다는 사실과 더 좋아졌다는 결과를 구분한다</text>
<text x="50" y="146.9" fill="#626a73" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">기준 모형·다른 모형·평균의 오차를 같은 목표값으로 비교한다.</text>
<text x="55" y="224.3" fill="#1b2340" font-size="32" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">A</text>
<rect x="320" y="198.3" width="216.66666666666666" height="44" rx="2" fill="#2e6b60" stroke="#dcded7" stroke-width="2" />
<text x="990" y="222.4" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">1</text>
<text x="55" y="314.3" fill="#1b2340" font-size="32" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">B</text>
<rect x="320" y="288.3" width="650.0" height="44" rx="2" fill="#2e6b60" stroke="#dcded7" stroke-width="2" />
<text x="990" y="312.4" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">3</text>
<text x="55" y="404.3" fill="#1b2340" font-size="32" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">평균</text>
<rect x="320" y="378.3" width="433.3333333333333" height="44" rx="2" fill="#2e6b60" stroke="#dcded7" stroke-width="2" />
<text x="990" y="402.4" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">2</text>
<text x="50" y="532.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">정답0에서 A1·B3·평균2의 절대오차는 각각1·3·2로 평균이 A보다 나쁘다.</text>
<text x="50" y="871.4" fill="#626a73" font-size="20" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">ourfuture studio · 직접 만든 교육용 예제</text>
