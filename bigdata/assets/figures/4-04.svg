  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #a12d48" x="468" y="303.6" transform="rotate(-0 468 303.6)">재현율: 실제 양성 행</text>
