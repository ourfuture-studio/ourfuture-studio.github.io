  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #a12d48" x="468" y="303.6" transform="rotate(-0 468 303.6)">재현율: 실제 양성 행</text>
  </g>
  <g id="text_15">
   <text style="font-size: 14px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #1d2541" x="468" y="342.24" transform="rotate(-0 468 342.24)">3 ÷ (3+2) = 60%</text>
  </g>
  <g id="text_16">
