  <g id="text_16">
   <text style="font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #1d2541" x="36" y="486.704844" transform="rotate(-0 36 486.704844)">정밀도의 분모는 예측 양성 4통, 재현율의 분모는 실제 양성 5통이다.</text>
