  <g id="text_9">
   <text style="font-weight: 700; font-size: 21px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #1d2541" x="36" y="43.911797" transform="rotate(-0 36 43.911797)">정밀도와 재현율은 같은 분자를 다른 집합으로 나눈다</text>
