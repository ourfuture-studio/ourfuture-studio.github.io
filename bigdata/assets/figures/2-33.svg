<text x="50" y="887.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">P(불량|B)=30/100=30%, P(B|불량)=30/40=75%다. 조건에 따라 분모가 다르다.</text>
<text x="50" y="963.4" fill="#626a73" font-size="20" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">ourfuture studio · 직접 만든 교육용 예제</text>
