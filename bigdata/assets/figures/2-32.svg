<text x="612.0" y="556.2" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">값</text>
<line x1="875.0" y1="515.1" x2="875.0" y2="600.1" stroke="#dcded7" stroke-width="2" />
<text x="887.0" y="556.2" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">표본틀 포함</text>
<rect x="50" y="600.1" width="1100" height="85" rx="2" fill="#fff" stroke="#dcded7" stroke-width="2" />
<text x="62.0" y="641.2" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">전화있음</text>
<line x1="325.0" y1="600.1" x2="325.0" y2="685.1" stroke="#dcded7" stroke-width="2" />
<text x="337.0" y="641.2" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">1000</text>
<line x1="600.0" y1="600.1" x2="600.0" y2="685.1" stroke="#dcded7" stroke-width="2" />
<text x="612.0" y="641.2" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">100</text>
<line x1="875.0" y1="600.1" x2="875.0" y2="685.1" stroke="#dcded7" stroke-width="2" />
<text x="887.0" y="641.2" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">예</text>
<rect x="50" y="685.1" width="1100" height="85" rx="2" fill="#fff" stroke="#dcded7" stroke-width="2" />
<text x="62.0" y="726.2" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">전화없음</text>
<line x1="325.0" y1="685.1" x2="325.0" y2="770.1" stroke="#dcded7" stroke-width="2" />
