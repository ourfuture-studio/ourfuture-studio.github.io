<line x1="600.0" y1="685.1" x2="600.0" y2="770.1" stroke="#dcded7" stroke-width="2" />
<text x="612.0" y="726.2" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">0</text>
<line x1="875.0" y1="685.1" x2="875.0" y2="770.1" stroke="#dcded7" stroke-width="2" />
<text x="887.0" y="726.2" fill="#1b2340" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">아니오</text>
<text x="50" y="831.2" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">전화 있음1000명은 값100, 없음1000명은 값0인 자체 예다. 목표평균50과 전화</text>
<text x="50" y="874.7" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">표본틀 평균100을 구분한다.</text>
<text x="50" y="951.4" fill="#626a73" font-size="20" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">ourfuture studio · 직접 만든 교육용 예제</text>
