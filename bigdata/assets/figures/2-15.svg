<text x="50" y="146.9" fill="#626a73" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">관측값을 바꾸어 구간 경계의 소속과 구간화의 정보 손실을 확인한다.</text>
