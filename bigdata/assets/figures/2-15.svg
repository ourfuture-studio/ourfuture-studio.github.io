<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1644" viewBox="0 0 1200 1644" role="img" aria-labelledby="terminology-title"><title id="terminology-title">이산화(Discretization)와 구간화(Binning)</title><desc>기존 교육 도표의 수치와 도형을 보존하고 정식 한국어·영문 용어를 덧붙인 자료입니다.</desc><rect width="1200" height="1644" fill="#fbfaf6" /><text x="48" y="38" fill="#626a73" font-size="20" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="400">빅데이터분석기사 · 2-15</text><text x="48" y="86" fill="#1b2340" font-size="34" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="700">이산화(Discretization)와 구간화(Binning)</text><line x1="48" x2="1152" y1="134" y2="134" stroke="#dcded7" stroke-width="2" /><g transform="translate(0 146)"><svg width="1200" height="1162" viewBox="0 0 1200 1162" role="img" x="0" y="0" overflow="hidden">
