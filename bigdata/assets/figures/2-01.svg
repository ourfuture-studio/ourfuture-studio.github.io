<text x="50" y="682.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">A의 표준편차는10g, B는4g이지만 평균에 대한 비율은 각각10%,20%다.</text>
