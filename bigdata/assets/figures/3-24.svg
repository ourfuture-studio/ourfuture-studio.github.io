<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1077" viewBox="0 0 1200 1077" role="img">
<rect width="1200" height="1077" fill="#fbfaf6"/>
<text x="50" y="78.7" fill="#1b2340" font-size="44" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">정준상관은 두 묶음에서 점수를 하나씩 만든다</text>
<text x="50" y="146.9" fill="#626a73" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">두 변수 묶음과 두 점수의 역할을 보인다.</text>
