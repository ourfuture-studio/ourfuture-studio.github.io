font-size="25" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="700">상관관계</text><text x="66" y="1589" fill="#626a73" font-size="23" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="400">Correlation</text><rect x="612" y="1521" width="540" height="89" rx="12" fill="#ffffff" stroke="#dcded7" stroke-width="1.5" /><text x="630" y="1556" fill="#1b2340" font-size="25" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="700">상관계수</text><text x="630" y="1589" fill="#626a73" font-size="23" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="400">Correlation Coefficient</text></svg>