<line x1="850" y1="320" x2="834.2035138859733" y2="328.62965969487567" stroke="#2e6b60" stroke-width="5"/>
<line x1="850" y1="320" x2="834.2035138859733" y2="311.37034030512433" stroke="#2e6b60" stroke-width="5"/>
<rect x="280" y="550" width="640" height="175" rx="14" fill="#f1f3f8" stroke="#dcded7" stroke-width="2"/>
<text x="300" y="597.1" fill="#1b2340" font-size="31" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">B 안의 상세 설계</text>
<text x="300" y="645.2" fill="#626a73" font-size="25" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">입력·목표·손실함수·알고리즘 후보</text>
<text x="300" y="681.5" fill="#626a73" font-size="25" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">과제 B 내부의 선택이며 A→B→C를 대신하지 않음</text>
<line x1="600" y1="400" x2="600" y2="550" stroke="#d4dcd1" stroke-width="3"/>
<text x="50" y="851.2" fill="#1b2340" font-size="27" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">A 코드 통일 → B 수요예측·검증 → C 발주 적용. B의 알고리즘은 내부 설계다.</text>
<text x="50" y="934.4" fill="#626a73" font-size="20" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">ourfuture studio · 직접 만든 교육용 예제</text>
