<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img">
<rect width="1200" height="960" fill="#fbfaf6"/>
<text x="50" y="74.7" fill="#1b2340" font-size="43" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">한 모형의 계획과 여러 과제의 로드맵</text>
<text x="50" y="137.5" fill="#626a73" font-size="28" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">과제 사이의 의존 관계와, 한 과제 안의 상세 설계는 다릅니다.</text>
<rect x="50" y="240" width="300" height="160" rx="14" fill="#eef4ed" stroke="#dcded7" stroke-width="2"/>
<text x="70" y="287.1" fill="#1b2340" font-size="31" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">A  코드 통일</text>
<text x="70" y="335.2" fill="#626a73" font-size="25" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">담당 부서 합의</text>
<rect x="450" y="240" width="300" height="160" rx="14" fill="#eef4ed" stroke="#dcded7" stroke-width="2"/>
<text x="470" y="287.1" fill="#1b2340" font-size="31" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">B  수요예측</text>
<text x="470" y="335.2" fill="#626a73" font-size="25" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">A의 통합 코드 필요</text>
<rect x="850" y="240" width="300" height="160" rx="14" fill="#eef4ed" stroke="#dcded7" stroke-width="2"/>
<text x="870" y="287.1" fill="#1b2340" font-size="31" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="600">C  발주 적용</text>
<text x="870" y="335.2" fill="#626a73" font-size="25" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">B의 검증 결과 필요</text>
<line x1="350" y1="320" x2="450" y2="320" stroke="#2e6b60" stroke-width="5"/>
<line x1="450" y1="320" x2="434.2035138859733" y2="328.62965969487567" stroke="#2e6b60" stroke-width="5"/>
