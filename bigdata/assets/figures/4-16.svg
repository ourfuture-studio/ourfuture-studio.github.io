  </g>
  <g id="text_32">
   <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2541" transform="translate(36 486.135078)">p=0.6·0.8·0.9의 Brier는 0.20·0.16·0.17이다. 같은 라벨 정확도는 확률</text>
