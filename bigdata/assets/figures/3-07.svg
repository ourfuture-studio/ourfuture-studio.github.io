<text x="50" y="936.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">부모 음성5·양성3을 음성2의 순수 자식과 음성3·양성3의 혼합 자식으로 나눈다.</text>
