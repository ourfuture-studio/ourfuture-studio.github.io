<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1619" viewBox="0 0 1200 1619" role="img" aria-labelledby="terminology-title"><title id="terminology-title">정규분포(Normal Distribution)의 적합도 검정(Goodness-of-Fit Test)과 자유도(Degrees of Freedom)</title><desc>기존 교육 도표의 수치와 도형을 보존하고 정식 한국어·영문 용어를 덧붙인 자료입니다.</desc><rect width="1200" height="1619" fill="#fbfaf6" /><text x="48" y="38" fill="#626a73" font-size="20" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="400">빅데이터분석기사 · 4-02</text><text x="48" y="86" fill="#1b2340" font-size="34" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="700">정규분포(Normal Distribution)의 적합도 검정(Goodness-of-Fit</text><text x="48" y="134" fill="#1b2340" font-size="34" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-weight="700">Test)과 자유도(Degrees of Freedom)</text><line x1="48" x2="1152" y1="182" y2="182" stroke="#dcded7" stroke-width="2" /><g transform="translate(0 194)"><svg width="1200" height="984" viewBox="0 0 1200 984" role="img" x="0" y="0" overflow="hidden">
