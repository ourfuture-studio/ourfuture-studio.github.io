<text x="50" y="879.4" fill="#343b49" font-size="30" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-weight="400">8구간 → 사전 규칙으로 6구간 병합 → 최종 도수로 μ·σ 추정 → 자유도3.</text>
