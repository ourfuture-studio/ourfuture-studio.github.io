<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="578" viewBox="0 0 1200 578" role="img"><title>같은 입력 두 개를 다른 순서로 처리합니다</title><desc>항등 활성화(Identity Activation)의 교육용 순환식입니다. 실제 학습이나 Seq2Seq(Sequence-to-Sequence) 디코더의 출력 품질을 평가한 예는 아닙니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-35 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 입력 두 개를 다른 순서로 처리합니다</text><rect x="44.0" y="146.0" width="346.7" height="296.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">원래 순서 (2,0)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">h₀=0 → h₁=2</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">h₂=0.5×2+0</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">마지막 상태 1</text><rect x="426.7" y="146.0" width="346.7" height="296.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">역순 (0,2)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">h₀=0 → h₁=0</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">h₂=0.5×0+2</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">마지막 상태 2</text><rect x="809.3" y="146.0" width="346.7" height="296.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">계수 ρ=1이면</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">hₜ=hₜ₋₁+xₜ</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">두 순서 모두 입력 합 2</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">이 고정 식에서는</text><text x="831.3" y="410.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">같음</text><text x="44.0" y="481.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">항등 활성화(Identity Activation)의 교육용 순환식입니다. 실제 학습이나 Seq2Seq(</text><text x="44.0" y="517.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">Sequence-to-Sequence) 디코더의 출력 품질을 평가한 예는 아닙니다.</text></svg>