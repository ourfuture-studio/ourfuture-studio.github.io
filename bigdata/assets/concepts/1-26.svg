<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="529" viewBox="0 0 1200 529" role="img"><title>첫 응답과 전체 수집을 구별하기</title><desc>반환 건수의 합이 맞는 것은 한 검사다. 자료가 갱신되거나 중복이 있으면 합계만으로 완전성을 확정할 수 없다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-26 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">첫 응답과 전체 수집을 구별하기</text><rect x="44.0" y="146.0" width="346.7" height="246.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">첫 페이지(Page 1)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">전체 120건, 페이지당 50건</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">첫 응답: 50건</text><path d="M395.7 269.2L419.7 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 261.2L420.6666666666667 269.2L407.6666666666667 277.2Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="246.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">다음 페이지들(</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Pagination)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">둘째 50건, 셋째 20건</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">페이지와 반환 건수를 대조</text><path d="M778.3 269.2L802.3 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 261.2L803.3333333333334 269.2L790.3333333333334 277.2Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="246.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">검증(Validation)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">50+50+20=120</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">중복 ID·조건·응답 시각도</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">확인</text><text x="44.0" y="431.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">반환 건수의 합이 맞는 것은 한 검사다. 자료가 갱신되거나 중복이 있으면 합계만으로 완전성을</text><text x="44.0" y="467.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">확정할 수 없다.</text></svg>