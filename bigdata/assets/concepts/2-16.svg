<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img"><title>같은 파랑을 다른 열 순서로 표현하기</title><desc>색상이 같아도 열 순서가 바뀌면 1의 위치가 바뀐다. 벡터만 보지 말고 대응 범주를 함께 보관한다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-16 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 파랑을 다른 열 순서로 표현하기</text><rect x="44.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">열 순서 ①(Category Order)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">빨강 · 파랑 · 초록</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">파랑 → [0,1,0]</text><rect x="618.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">열 순서 ②(Category Order)</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">파랑 · 빨강 · 초록</text><text x="643.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">파랑 → [1,0,0]</text><text x="44.0" y="395.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">색상이 같아도 열 순서가 바뀌면 1의 위치가 바뀐다. 벡터만 보지 말고 대응 범주를 함께 보관한다.</text></svg>