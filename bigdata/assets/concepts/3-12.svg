<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>손실 계산, 기울기 계산, 가중치 갱신은 다른 단계입니다</title><desc>기울기를 계산한 상태와 실제 매개변수를 바꾼 상태를 분리해서 봅니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-12 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">손실 계산, 기울기 계산, 가중치 갱신은 다른 단계입니다</text><rect x="44.0" y="146.0" width="346.7" height="289.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">순전파(Forward</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Propagation)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">x=2, t=0, w=1</text><text x="69.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">ŷ=2, 손실 L=2</text><text x="66.0" y="405.0" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">아직 w=1</text><path d="M395.7 290.7L419.7 290.7" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 282.7L420.6666666666667 290.7L407.6666666666667 298.7Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="289.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">역전파(Backpropagation</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">g=∂L/∂w=(ŷ−t)x</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">g=(2−0)×2=4</text><text x="448.7" y="405.0" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">아직 w=1</text><path d="M778.3 290.7L802.3 290.7" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 282.7L803.3333333333334 290.7L790.3333333333334 298.7Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="289.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">갱신(Update)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">학습률(Learning Rate) η=</text><text x="834.3" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">0.1</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">w′=1−0.1×4</text><text x="831.3" y="402.1" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">새 w=0.6</text><text x="44.0" y="474.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 오차의 미분</text><text x="44.0" y="516.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 기울기 반대 방향으로 이동</text><text x="44.0" y="558.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">기울기를 계산한 상태와 실제 매개변수를 바꾼 상태를 분리해서 봅니다.</text></svg>