<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="527" viewBox="0 0 1200 527" role="img"><title>처리 행위가 달라지면 근거도 다시 확인</title><desc>동의를 근거로 제공하는 경우 법이 요구하는 고지 내용을 실제 처리 행위와 대조한다. 동의만이 유일한 법적 근거라는 뜻은 아니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-19 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">처리 행위가 달라지면 근거도 다시 확인</text><rect x="44.0" y="146.0" width="346.7" height="244.8" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">배송 연락처</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">주문 처리에 필요한 정보</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">기존 수집·이용 목적 확인</text><path d="M395.7 268.4L419.7 268.4" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 260.4L420.6666666666667 268.4L407.6666666666667 276.4Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="244.8" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">배송 알림 동의(Consent)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">알린 내용과 범위를 확인</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">광고 제공 동의로 자동 확장</text><text x="451.7" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">불가</text><path d="M778.3 268.4L802.3 268.4" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 260.4L803.3333333333334 268.4L790.3333333333334 276.4Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="244.8" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">다른 회사 광고 제공</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">제공받는 자·목적·항목</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">보유 기간·거부 권리 등</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">확인</text><text x="44.0" y="429.8" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">동의를 근거로 제공하는 경우 법이 요구하는 고지 내용을 실제 처리 행위와 대조한다. 동의만이</text><text x="44.0" y="465.8" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">유일한 법적 근거라는 뜻은 아니다.</text></svg>