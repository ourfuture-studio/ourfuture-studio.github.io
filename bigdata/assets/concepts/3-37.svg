<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="619" viewBox="0 0 1200 619" role="img"><title>부호 있는 오차 합과 평균제곱오차를 구분합니다</title><desc>복원값을 지정해 오차를 계산한 예입니다. 인코더(Encoder)·디코더(Decoder)를 학습하거나 잠재표현을 추정한 결과는 아닙니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-37 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">부호 있는 오차 합과 평균제곱오차를 구분합니다</text><rect x="44.0" y="146.0" width="346.7" height="253.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">원본과 복원</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">원본 x=(2,4)</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">복원 x̂=(1,5)</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">서로 다른 두 벡터</text><path d="M395.7 272.5L419.7 272.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 264.5L420.6666666666667 272.5L407.6666666666667 280.5Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="253.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">좌표별 오차</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">x−x̂=(1,−1)</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">그냥 더하면 1−1=0</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">오차 합 0</text><path d="M778.3 272.5L802.3 272.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 264.5L803.3333333333334 272.5L790.3333333333334 280.5Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="253.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">제곱한 뒤 평균</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">1²+(−1)²=2</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">좌표 수 2로 나눔</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">MSE=1</text><text x="44.0" y="438.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 좌표별로 빼기</text><text x="44.0" y="480.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 상쇄되기 전에 제곱</text><text x="44.0" y="522.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">복원값을 지정해 오차를 계산한 예입니다. 인코더(Encoder)·디코더(Decoder)를 학습하거나</text><text x="44.0" y="558.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">잠재표현을 추정한 결과는 아닙니다.</text></svg>