<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img"><title>목적 분석 DB에 도착한 시점을 기준으로 비교</title><desc>이 예제의 목적지는 분석 DB다. 중간 임시 파일 저장을 목적지 적재로 바꾸어 읽지 않는다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-28 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">목적 분석 DB에 도착한 시점을 기준으로 비교</text><rect x="44.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">ETL(Extract, Transform, Load)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">추출 → 외부에서 단위 통일</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">→ 목적 분석 DB에 적재</text><rect x="618.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">ELT(Extract, Load, Transform)</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">추출 → 목적 분석 DB에 원본 적재</text><text x="643.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">→ 그 DB 안에서 단위 통일</text><text x="44.0" y="395.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">이 예제의 목적지는 분석 DB다. 중간 임시 파일 저장을 목적지 적재로 바꾸어 읽지 않는다.</text></svg>