<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="656" viewBox="0 0 1200 656" role="img"><title>문서 안의 횟수와 단어를 포함한 문서 수를 구분합니다</title><desc>본문 식은 IDF=ln(N/DF), 벡터 정규화 없음입니다. scikit-learn의 평활화와 +1 및 기본 정규화 설정을 그대로 대입한 식이 아닙니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-33 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">문서 안의 횟수와 단어를 포함한 문서 수를 구분합니다</text><rect x="44.0" y="146.0" width="346.7" height="289.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">현재 문서의 단어빈도</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">단어 t가 현재 문서에 2번</text><text x="69.0" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">등장</text><text x="69.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">원시 빈도 TF=2</text><text x="66.0" y="402.1" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">한 문서 안에서 셈</text><path d="M395.7 290.7L419.7 290.7" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 282.7L420.6666666666667 290.7L407.6666666666667 298.7Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="289.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">문서빈도(Document</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Frequency)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">전체 문서 N=4</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">t를 포함한 문서 DF=2</text><text x="448.7" y="405.0" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">문서 수를 셈</text><path d="M778.3 290.7L802.3 290.7" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 282.7L803.3333333333334 290.7L790.3333333333334 298.7Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="289.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">본문이 지정한 가중치</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">IDF=ln(4/2)=ln2</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">TF-IDF=2×ln2</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">약 1.386</text><text x="44.0" y="474.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 전체 문서에서 DF 확인</text><text x="44.0" y="516.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 지정된 IDF와 곱하기</text><text x="44.0" y="558.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">본문 식은 IDF=ln(N/DF), 벡터 정규화 없음입니다. scikit-learn의 평활화와 +1 및 기본 정규화</text><text x="44.0" y="594.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">설정을 그대로 대입한 식이 아닙니다.</text></svg>