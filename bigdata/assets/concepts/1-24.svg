<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="527" viewBox="0 0 1200 527" role="img"><title>같은 문의, 서로 다른 표현</title><desc>녹음에서 유형을 추출해 표로 만들면 새 정형 산출물이 생긴다. 원본과 가공 결과의 구조를 따로 표시한다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-24 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 문의, 서로 다른 표현</text><rect x="44.0" y="146.0" width="346.7" height="244.8" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">정형(Structured)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">문의ID·접수일·유형</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">고정 열을 가진 표</text><rect x="426.7" y="146.0" width="346.7" height="244.8" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">반정형(Semi-structured)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">키와 중첩 항목을 가진</text><text x="451.7" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">JSON</text><text x="451.7" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">선택 항목이 있을 수 있음</text><rect x="809.3" y="146.0" width="346.7" height="244.8" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">비정형(Unstructured)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">자유롭게 말한 통화 녹음</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">원본 음성 자체를 분석</text><text x="44.0" y="429.8" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">녹음에서 유형을 추출해 표로 만들면 새 정형 산출물이 생긴다. 원본과 가공 결과의 구조를 따로</text><text x="44.0" y="465.8" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">표시한다.</text></svg>