<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img"><title>미래 정답까지 있는 창만 완전한 학습 쌍입니다</title><desc>시간순 값 10·11·12·13·14, 창 길이 3, 예측 간격 1입니다. 입력 창 수와 완성된 입력·정답 쌍 수가 다를 수 있습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-27 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">미래 정답까지 있는 창만 완전한 학습 쌍입니다</text><rect x="44.0" y="146.0" width="346.7" height="253.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">첫 번째 창</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">입력 10·11·12</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">한 시점 앞 정답 13</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">완전한 쌍</text><rect x="426.7" y="146.0" width="346.7" height="253.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">두 번째 창</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">입력 11·12·13</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">한 시점 앞 정답 14</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">완전한 쌍</text><rect x="809.3" y="146.0" width="346.7" height="253.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">마지막 입력 창</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">입력 12·13·14</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">다음 시점 정답은 아직 없음</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">입력만 존재</text><text x="44.0" y="438.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">시간순 값 10·11·12·13·14, 창 길이 3, 예측 간격 1입니다. 입력 창 수와 완성된 입력·정답 쌍 수가</text><text x="44.0" y="474.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">다를 수 있습니다.</text></svg>