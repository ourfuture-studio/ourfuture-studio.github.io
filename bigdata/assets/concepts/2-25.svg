<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="613" viewBox="0 0 1200 613" role="img"><title>원자료에서 분산과 표준편차까지</title><desc>편차의 합은 0이므로 세 편차를 모두 독립적으로 정할 수 없습니다. 분산은 제곱 단위, 표준편차는 원래 단위입니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-25 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">원자료에서 분산과 표준편차까지</text><rect x="44.0" y="146.0" width="346.7" height="246.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">원자료(Raw Data)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">2 · 4 · 6</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">표본평균 4</text><path d="M395.7 269.2L419.7 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 261.2L420.6666666666667 269.2L407.6666666666667 277.2Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="246.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">편차제곱합(Sum of</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Squared Deviations)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">(−2)² + 0² + 2²</text><text x="448.7" y="360.2" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">8</text><path d="M778.3 269.2L802.3 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 261.2L803.3333333333334 269.2L790.3333333333334 277.2Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="246.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">표본분산(Sample</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Variance)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">8 ÷ (3−1)=4</text><text x="834.3" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">표본 표준편차 √4=2</text><text x="44.0" y="431.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 평균을 빼고 제곱</text><text x="44.0" y="473.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. n−1로 나눔</text><text x="44.0" y="515.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">편차의 합은 0이므로 세 편차를 모두 독립적으로 정할 수 없습니다. 분산은 제곱 단위, 표준편차는</text><text x="44.0" y="551.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">원래 단위입니다.</text></svg>