<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img"><title>처음 칸이 아니라 최종 표를 센다</title><desc>6은 관측값 개수가 아니라 최종 범주 수입니다. 병합 전8을 그대로 사용하면 이 예제의 표와 맞지 않습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">4-02 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">처음 칸이 아니라 최종 표를 센다</text><rect x="44.0" y="146.0" width="346.7" height="281.2" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">처음 구간</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">8개 구간</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">꼬리 구간 병합</text><path d="M395.7 286.6L419.7 286.6" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 278.6L420.6666666666667 286.6L407.6666666666667 294.6Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="281.2" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">최종 도수표(Frequency</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Table)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">k=6</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">최종 기대도수는</text><text x="451.7" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">충분하다고 가정</text><path d="M778.3 286.6L802.3 286.6" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 278.6L803.3333333333334 286.6L790.3333333333334 294.6Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="281.2" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">추정한 μ·σ</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">총합 제약1 · 추정모수2</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">6−1−2</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">df=3</text><text x="44.0" y="466.2" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 병합</text><text x="44.0" y="508.2" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 자유도 계산</text><text x="44.0" y="550.2" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">6은 관측값 개수가 아니라 최종 범주 수입니다. 병합 전8을 그대로 사용하면 이 예제의 표와 맞지</text><text x="44.0" y="586.2" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">않습니다.</text></svg>