<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="527" viewBox="0 0 1200 527" role="img"><title>같은 방향의 오차는 평균에도 남는다</title><desc>결합은 B보다 낫지만 A보다 나쁩니다. 모형을 더했다는 사실만으로 최선 모형보다 좋아지지는 않습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">4-25 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 방향의 오차는 평균에도 남는다</text><rect x="44.0" y="146.0" width="346.7" height="244.6" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">모형 A</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">정답0에 예측1</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">절대오차1</text><rect x="426.7" y="146.0" width="346.7" height="244.6" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">모형 B</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">정답0에 예측3</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">절대오차3</text><rect x="809.3" y="146.0" width="346.7" height="244.6" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">동일 가중 평균(</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Equal-weight Average)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">(1+3)/2=2</text><text x="831.3" y="360.2" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">절대오차2</text><text x="44.0" y="429.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">결합은 B보다 낫지만 A보다 나쁩니다. 모형을 더했다는 사실만으로 최선 모형보다 좋아지지는</text><text x="44.0" y="465.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">않습니다.</text></svg>