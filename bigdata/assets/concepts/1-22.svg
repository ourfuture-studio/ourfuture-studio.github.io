<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="578" viewBox="0 0 1200 578" role="img"><title>한 표를 서로 다른 세 기준으로 보기</title><desc>각 기준을 따로 계산한다. 두 질환 사이의 거리를 1로 정한 이진 사례에서만 EMD가 비율 차이와 같다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-22 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">한 표를 서로 다른 세 기준으로 보기</text><rect x="44.0" y="146.0" width="346.7" height="296.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">k-익명성(k-Anonymity)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">두 집단의 크기는 각각 2</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">최소 집단 크기 k=2</text><rect x="426.7" y="146.0" width="346.7" height="296.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">구별값 l-다양성(Distinct</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">l-Diversity)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">첫 집단 질환은 감기·감기</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">최소 질환 종류 수는 1</text><rect x="809.3" y="146.0" width="346.7" height="296.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">t-근접성(t-Closeness)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">천식 비율: 전체 0.25</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">집단별 0 또는 0.5</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">이진 EMD 최댓값</text><text x="831.3" y="410.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">0.25</text><text x="44.0" y="481.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">각 기준을 따로 계산한다. 두 질환 사이의 거리를 1로 정한 이진 사례에서만 EMD가 비율 차이와</text><text x="44.0" y="517.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">같다.</text></svg>