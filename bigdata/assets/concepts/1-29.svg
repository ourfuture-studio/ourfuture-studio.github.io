<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img"><title>저장할 자료와 필요한 분석 범위를 나누기</title><desc>네 개를 한 줄의 발전 단계로 보지 않는다. 레이크하우스 기반 안에 특정 데이터 마트 범위를 구성할 수도 있다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-29 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">저장할 자료와 필요한 분석 범위를 나누기</text><rect x="44.0" y="146.0" width="251.0" height="352.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">데이터</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">웨어하우스(Data</text><text x="66.0" y="297.4" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Warehouse)</text><text x="69.0" y="343.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">전사 매출 지표</text><text x="69.0" y="377.9" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">통합</text><text x="69.0" y="422.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">공통 보고를 위한</text><text x="69.0" y="457.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">분석 자료</text><rect x="331.0" y="146.0" width="251.0" height="352.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="354.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="353.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">데이터 마트(Data</text><text x="353.0" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Mart)</text><text x="356.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">마케팅 부서·</text><text x="356.0" y="340.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">캠페인 주제</text><text x="356.0" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">특정 사용자와</text><text x="356.0" y="419.8" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">주제의 범위</text><rect x="618.0" y="146.0" width="251.0" height="352.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="641.0" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="640.0" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">데이터 레이크(</text><text x="640.0" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Data Lake)</text><text x="643.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">영상·로그·표 등</text><text x="643.0" y="340.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">원본</text><text x="643.0" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">다양한 형태의</text><text x="643.0" y="419.8" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">자료 보관</text><rect x="905.0" y="146.0" width="251.0" height="352.4" rx="14" fill="#f5f1e8" stroke="#837242" stroke-width="2"/><text x="928.0" y="182.0" fill="#837242" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">D</text><text x="927.0" y="222.0" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">데이터</text><text x="927.0" y="259.7" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">레이크하우스(</text><text x="927.0" y="297.4" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Data Lakehouse)</text><text x="930.0" y="343.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">레이크 자료에</text><text x="930.0" y="377.9" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">관리되는 테이블</text><text x="930.0" y="422.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">질의 등 분석 관리</text><text x="930.0" y="457.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">기능 결합</text><text x="44.0" y="537.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">네 개를 한 줄의 발전 단계로 보지 않는다. 레이크하우스 기반 안에 특정 데이터 마트 범위를</text><text x="44.0" y="573.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">구성할 수도 있다.</text></svg>