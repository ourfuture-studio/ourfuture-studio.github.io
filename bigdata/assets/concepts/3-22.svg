<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="788" viewBox="0 0 1200 788" role="img"><title>네 칸의 관측빈도를 독립일 때의 10명과 비교합니다</title><desc>각 행 합과 열 합은 20명이고 전체는 40명입니다. 네 기여를 더한 보정 없는 χ²는 1.6입니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-22 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">네 칸의 관측빈도를 독립일 때의 10명과 비교합니다</text><rect x="44.0" y="146.0" width="538.0" height="253.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">채널 A · 구매</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">관측빈도(Observed Frequency) 12</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">기대빈도(Expected Frequency) 10</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">χ² 기여 0.4</text><rect x="618.0" y="146.0" width="538.0" height="253.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">채널 A · 미구매</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">관측빈도 8</text><text x="643.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">기대빈도 10</text><text x="640.0" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">χ² 기여 0.4</text><rect x="44.0" y="435.0" width="538.0" height="253.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="67.0" y="471.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="66.0" y="511.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">채널 B · 구매</text><text x="69.0" y="556.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">관측빈도 8</text><text x="69.0" y="601.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">기대빈도 10</text><text x="66.0" y="656.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">χ² 기여 0.4</text><rect x="618.0" y="435.0" width="538.0" height="253.0" rx="14" fill="#f5f1e8" stroke="#837242" stroke-width="2"/><text x="641.0" y="471.0" fill="#837242" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">D</text><text x="640.0" y="511.0" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">채널 B · 미구매</text><text x="643.0" y="556.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">관측빈도 12</text><text x="643.0" y="601.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">기대빈도 10</text><text x="640.0" y="656.3" fill="#837242" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">χ² 기여 0.4</text><text x="44.0" y="727.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">각 행 합과 열 합은 20명이고 전체는 40명입니다. 네 기여를 더한 보정 없는 χ²는 1.6입니다.</text></svg>