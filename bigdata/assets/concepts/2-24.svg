<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575" role="img"><title>속도 숫자보다 거리와 시간을 먼저 합친다</title><desc>느린 구간에서 더 오래 이동했습니다. 두 속도를 같은 시간으로 가중한 산술평균 45와 구분합니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-24 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">속도 숫자보다 거리와 시간을 먼저 합친다</text><rect x="44.0" y="146.0" width="346.7" height="244.6" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">첫 구간</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">60km ÷ 30km/h</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">2시간</text><path d="M395.7 268.3L419.7 268.3" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 260.3L420.6666666666667 268.3L407.6666666666667 276.3Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="244.6" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">둘째 구간</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">60km ÷ 60km/h</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">1시간</text><path d="M778.3 268.3L802.3 268.3" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 260.3L803.3333333333334 268.3L790.3333333333334 276.3Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="244.6" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">전체 평균 속도(Average</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Speed)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">총거리 120km ÷ 3시간</text><text x="831.3" y="360.2" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">40km/h</text><text x="44.0" y="429.6" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 같은 거리</text><text x="44.0" y="471.6" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 거리·시간 합산</text><text x="44.0" y="513.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">느린 구간에서 더 오래 이동했습니다. 두 속도를 같은 시간으로 가중한 산술평균 45와 구분합니다.</text></svg>