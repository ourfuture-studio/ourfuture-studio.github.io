<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="621" viewBox="0 0 1200 621" role="img"><title>순위(Rank)를 매기기 전에 누구의 자료인지 봅니다</title><desc>작은 표본이라는 이유 하나로 검정을 고르지 않습니다. 부호순위 검정은 대응 차이의 분포 조건도 확인합니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-03 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">순위(Rank)를 매기기 전에 누구의 자료인지 봅니다</text><rect x="44.0" y="146.0" width="346.7" height="339.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">서로 다른 사람의 두 집단</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">독립표본(Independent</text><text x="69.0" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">Samples)</text><text x="69.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">A={1,3,5}, B={2,4,6}</text><text x="66.0" y="402.1" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">Mann–Whitney U</text><rect x="426.7" y="146.0" width="346.7" height="339.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">동일인의 전·후 두 값</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">대응표본(Paired Samples)</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">사람별 차이를 계산</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">윌콕슨 부호순위</text><text x="448.7" y="410.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">검정(Wilcoxon</text><text x="448.7" y="453.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">Signed-Rank Test)</text><rect x="809.3" y="146.0" width="346.7" height="339.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">차이 분포가 불명확할 때</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">대칭성(Symmetry) 등 가정</text><text x="834.3" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">확인</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이름만 보고 검정 확정하지</text><text x="834.3" y="382.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">않기</text><text x="831.3" y="436.9" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">추가 검토</text><text x="44.0" y="524.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">작은 표본이라는 이유 하나로 검정을 고르지 않습니다. 부호순위 검정은 대응 차이의 분포 조건도</text><text x="44.0" y="560.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">확인합니다.</text></svg>