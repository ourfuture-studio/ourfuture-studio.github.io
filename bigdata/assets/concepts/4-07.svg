<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img"><title>양성 두 개와 음성 두 개의 네 쌍</title><desc>같은 네 쌍에서 승리3개이므로 AUC=3/4입니다. 임곗값은 ROC 위에서 사용할 판정 지점을 고릅니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">4-07 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">양성 두 개와 음성 두 개의 네 쌍</text><rect x="44.0" y="146.0" width="538.0" height="208.2" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">양성0.9 vs 음성0.8</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">양성이 더 높음</text><text x="66.0" y="322.5" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">승리1</text><rect x="618.0" y="146.0" width="538.0" height="208.2" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">양성0.9 vs 음성0.2</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">양성이 더 높음</text><text x="640.0" y="322.5" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">승리1</text><rect x="44.0" y="390.2" width="538.0" height="208.2" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="67.0" y="426.2" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="66.0" y="466.2" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">양성0.6 vs 음성0.8</text><text x="69.0" y="511.9" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">양성이 더 낮음</text><text x="66.0" y="566.7" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">승리0</text><rect x="618.0" y="390.2" width="538.0" height="208.2" rx="14" fill="#f5f1e8" stroke="#837242" stroke-width="2"/><text x="641.0" y="426.2" fill="#837242" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">D</text><text x="640.0" y="466.2" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">양성0.6 vs 음성0.2</text><text x="643.0" y="511.9" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">양성이 더 높음</text><text x="640.0" y="566.7" fill="#837242" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">승리1</text><text x="44.0" y="637.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">같은 네 쌍에서 승리3개이므로 AUC=3/4입니다. 임곗값은 ROC 위에서 사용할 판정 지점을</text><text x="44.0" y="673.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">고릅니다.</text></svg>