<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="618" viewBox="0 0 1200 618" role="img"><title>숫자가 지나가는 두 경로를 나누어 봅니다</title><desc>h₂ 경로의 −x₂와 출력에서 h₂에 곱하는 2를 서로 다른 위치의 계수로 구분합니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-09 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">숫자가 지나가는 두 경로를 나누어 봅니다</text><rect x="44.0" y="146.0" width="346.7" height="287.8" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">입력(Input)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">x₁=2, x₂=1</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">두 은닉 경로에 같은 입력</text><text x="69.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">전달</text><text x="66.0" y="402.1" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">(2,1)</text><path d="M395.7 289.9L419.7 289.9" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 281.9L420.6666666666667 289.9L407.6666666666667 297.9Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="287.8" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">은닉층(Hidden Layer)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">h₁=ReLU(2+1−1)=2</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">h₂=ReLU(2−1)=1</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">h₁=2, h₂=1</text><path d="M778.3 289.9L802.3 289.9" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 281.9L803.3333333333334 289.9L790.3333333333334 297.9Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="287.8" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">출력층(Output Layer)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이 예의 출력은 선형 결합</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">y=h₁+2h₂=2+2×1</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">y=4</text><text x="44.0" y="472.8" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 각 경로의 가중합</text><text x="44.0" y="514.8" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 출력 가중치 적용</text><text x="44.0" y="556.8" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">h₂ 경로의 −x₂와 출력에서 h₂에 곱하는 2를 서로 다른 위치의 계수로 구분합니다.</text></svg>