<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="528" viewBox="0 0 1200 528" role="img"><title>예측 순간을 기준으로 정보를 나누기</title><desc>시간 화살표를 거꾸로 넘겨 미래 정보를 과거 예측 입력에 넣으면 실제 사용 조건과 달라진다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-16 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">예측 순간을 기준으로 정보를 나누기</text><rect x="44.0" y="146.0" width="346.7" height="281.2" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">접수 전(Prediction-time</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">History)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">접수 전 구매 이력</text><text x="69.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">시점 조건을 맞추면 입력</text><text x="69.0" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">후보</text><path d="M395.7 286.6L419.7 286.6" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 278.6L420.6666666666667 286.6L407.6666666666667 294.6Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="281.2" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">주문 접수(Prediction</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Time)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">반품 여부를 예측할 순간</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">당시 알 수 있는 정보만</text><text x="451.7" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">사용</text><path d="M778.3 286.6L802.3 286.6" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 278.6L803.3333333333334 286.6L790.3333333333334 294.6Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="281.2" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">반품 완료(Future</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Outcome)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">완료 뒤 생긴 반품 사유</text><text x="834.3" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">접수 시점에는 알 수 없음</text><text x="44.0" y="466.2" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">시간 화살표를 거꾸로 넘겨 미래 정보를 과거 예측 입력에 넣으면 실제 사용 조건과 달라진다.</text></svg>