<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="536" viewBox="0 0 1200 536" role="img"><title>개별 값과 평균들을 다른 분포로 본다</title><desc>한 번 평균내는 관측 수 n이 바뀝니다. 원자료의 모집단 분포가 정규분포로 바뀌는 것은 아닙니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-36 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">개별 값과 평균들을 다른 분포로 본다</text><rect x="44.0" y="146.0" width="346.7" height="289.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">개별 관측(Observation)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">평균100</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">표준편차12</text><rect x="426.7" y="146.0" width="346.7" height="289.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">36개씩 평균(Sample</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Mean)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">평균의 기댓값100</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">SE=12/√36</text><text x="448.7" y="405.0" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">2</text><rect x="809.3" y="146.0" width="346.7" height="289.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">144개씩 평균(Sample</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Mean)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">평균의 기댓값100</text><text x="834.3" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">SE=12/√144</text><text x="831.3" y="405.0" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">1</text><text x="44.0" y="474.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">한 번 평균내는 관측 수 n이 바뀝니다. 원자료의 모집단 분포가 정규분포로 바뀌는 것은 아닙니다.</text></svg>