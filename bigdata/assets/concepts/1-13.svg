<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="577" viewBox="0 0 1200 577" role="img"><title>준비하고 학습한 뒤 업무 목적을 다시 확인</title><desc>이 그림은 전체 CRISP-DM의 일부 단계다. 평가에서 입력 문제가 드러나면 준비로 돌아갈 수 있다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-13 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">준비하고 학습한 뒤 업무 목적을 다시 확인</text><rect x="44.0" y="146.0" width="346.7" height="246.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">데이터 준비(Data</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Preparation)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">코드와 입력 열 정리</text><text x="69.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">입력 오류를 확인</text><path d="M395.7 269.2L419.7 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 261.2L420.6666666666667 269.2L407.6666666666667 277.2Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="246.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">모델링(Modeling)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">예측 규칙을 학습</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">정해 둔 후보를 비교</text><path d="M778.3 269.2L802.3 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 261.2L803.3333333333334 269.2L790.3333333333334 277.2Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="246.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">평가(Evaluation)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">업무 목표에 부합하는가?</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">발주 마감 전 활용 가능한가</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">?</text><text x="44.0" y="431.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 학습 입력</text><text x="44.0" y="473.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 업무 목표 재검토</text><text x="44.0" y="515.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">이 그림은 전체 CRISP-DM의 일부 단계다. 평가에서 입력 문제가 드러나면 준비로 돌아갈 수 있다.</text></svg>