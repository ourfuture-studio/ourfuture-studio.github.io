<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img"><title>학습기 사이에 어떤 의존 관계가 있는지 봅니다</title><desc>모든 부스팅을 오분류 표본의 가중치를 올리는 한 방식으로 설명하지 않습니다. 아래 수치는 제곱오차 회귀의 주어진 보정을 보여 줍니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-30 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">학습기 사이에 어떤 의존 관계가 있는지 봅니다</text><rect x="44.0" y="146.0" width="346.7" height="365.6" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">배깅(Bagging)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">부트스트랩 표본별 기본</text><text x="69.0" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">학습기</text><text x="69.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">각 예측을 평균·투표 등으로</text><text x="69.0" y="382.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">결합</text><text x="66.0" y="436.9" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">앞 오답의 순차</text><text x="66.0" y="479.9" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">보정이 핵심 아님</text><rect x="426.7" y="146.0" width="346.7" height="365.6" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">기울기 부스팅(Gradient</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Boosting)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">앞 모형의 손실 방향으로</text><text x="451.7" y="340.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">보정</text><text x="451.7" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">학습률로 새 기여를 조절</text><text x="448.7" y="439.8" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">앞 단계 → 다음 보정</text><rect x="809.3" y="146.0" width="346.7" height="365.6" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">주어진 수치 예제</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">현재 (2,2), 보정 (1,3)</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">보정의 절반만 더하기</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">새 예측 (2.5,3.5)</text><text x="44.0" y="550.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">모든 부스팅을 오분류 표본의 가중치를 올리는 한 방식으로 설명하지 않습니다. 아래 수치는</text><text x="44.0" y="586.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">제곱오차 회귀의 주어진 보정을 보여 줍니다.</text></svg>