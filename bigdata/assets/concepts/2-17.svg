<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img"><title>같은 주문 한 행에서 새 열 계산</title><desc>서로 다른 주문의 수량과 단가를 섞지 않는다. 고객별 총액은 고객 ID와 집계 기간을 추가로 정해야 한다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-17 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 주문 한 행에서 새 열 계산</text><rect x="44.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">기존 입력(Original Inputs)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">주문 A 수량 2</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">주문 A 단가 5천원</text><rect x="618.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">파생변수(Derived Variable)</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">주문금액 = 수량×단가</text><text x="643.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">A: 2×5=10천원</text><text x="44.0" y="395.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">서로 다른 주문의 수량과 단가를 섞지 않는다. 고객별 총액은 고객 ID와 집계 기간을 추가로 정해야</text><text x="44.0" y="431.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">한다.</text></svg>