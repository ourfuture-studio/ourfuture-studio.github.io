<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="542" viewBox="0 0 1200 542" role="img"><title>대부분을 맞힌 것과 필요한 양성을 찾은 것</title><desc>양성을 모두 찾았다는 사실만으로 모든 비용 조건에서 B가 우수하다고 단정하지 않습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">4-06 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">대부분을 맞힌 것과 필요한 양성을 찾은 것</text><rect x="44.0" y="146.0" width="346.7" height="296.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">모형 A</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">실제 양성1 · 음성99</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">전부 음성으로 예측</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">정확도99% / 재현율</text><text x="66.0" y="410.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">0%</text><rect x="426.7" y="146.0" width="346.7" height="296.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">모형 B</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">양성1건 발견</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">정상3건에도 경고</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">정확도97% / 재현율</text><text x="448.7" y="410.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">100%</text><rect x="809.3" y="146.0" width="346.7" height="296.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">비용도 확인</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">B의 정밀도1/4=25%</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">놓침과 오경보의 비용은</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">다름</text><text x="44.0" y="481.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">양성을 모두 찾았다는 사실만으로 모든 비용 조건에서 B가 우수하다고 단정하지 않습니다.</text></svg>