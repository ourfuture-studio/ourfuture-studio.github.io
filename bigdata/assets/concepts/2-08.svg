<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="626" viewBox="0 0 1200 626" role="img"><title>사분위수에서 울타리를 계산해 후보 표시</title><desc>경계와 엄격히 바깥인 값을 구별한다. 이 예제에서 35는 위 울타리 자체다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-08 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">사분위수에서 울타리를 계산해 후보 표시</text><rect x="44.0" y="146.0" width="346.7" height="296.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">주어진 사분위수(</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Quartiles)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">Q1=10, Q3=20</text><text x="69.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">다시 계산할 원자료는 주지</text><text x="69.0" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">않음</text><path d="M395.7 294.0L419.7 294.0" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 286.0L420.6666666666667 294.0L407.6666666666667 302.0Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="296.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">사분위범위(Interquartile</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Range)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">IQR=20−10=10</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">1.5×IQR=15</text><path d="M778.3 294.0L802.3 294.0" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 286.0L803.3333333333334 294.0L790.3333333333334 302.0Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="296.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">울타리와 관측값(Fence)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">아래 −5, 위 35</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">관측값 40은 35보다 큼</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">후보 표시 · 오류</text><text x="831.3" y="410.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">미확정</text><text x="44.0" y="481.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 차이 10</text><text x="44.0" y="523.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 울타리와 비교</text><text x="44.0" y="565.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">경계와 엄격히 바깥인 값을 구별한다. 이 예제에서 35는 위 울타리 자체다.</text></svg>