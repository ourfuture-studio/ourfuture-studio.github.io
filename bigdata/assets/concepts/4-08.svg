<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="527" viewBox="0 0 1200 527" role="img"><title>같은 오차를 세 방식으로 요약한다</title><desc>MSE의 단위는 목표 단위의 제곱이고, MAE와 RMSE는 원래 단위입니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">4-08 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 오차를 세 방식으로 요약한다</text><rect x="44.0" y="146.0" width="251.0" height="281.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">오차(Error)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">e=−1 · 1 · 4</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">절댓값1 · 1 · 4</text><path d="M300.0 286.5L324.0 286.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M312.0 278.5L325.0 286.5L312.0 294.5Z" fill="#628d7c"/><rect x="331.0" y="146.0" width="251.0" height="281.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="354.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="353.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">MAE(Mean</text><text x="353.0" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Absolute Error)</text><text x="356.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">(1+1+4)/3</text><text x="353.0" y="360.2" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">2</text><path d="M587.0 286.5L611.0 286.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M599.0 278.5L612.0 286.5L599.0 294.5Z" fill="#628d7c"/><rect x="618.0" y="146.0" width="251.0" height="281.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="641.0" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="640.0" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">MSE(Mean</text><text x="640.0" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Squared Error)</text><text x="643.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">(1+1+16)/3</text><text x="640.0" y="360.2" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">6</text><path d="M874.0 286.5L898.0 286.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M886.0 278.5L899.0 286.5L886.0 294.5Z" fill="#628d7c"/><rect x="905.0" y="146.0" width="251.0" height="281.0" rx="14" fill="#f5f1e8" stroke="#837242" stroke-width="2"/><text x="928.0" y="182.0" fill="#837242" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">04</text><text x="927.0" y="222.0" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">RMSE(Root</text><text x="927.0" y="259.7" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Mean Squared</text><text x="927.0" y="297.4" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Error)</text><text x="930.0" y="343.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">√6</text><text x="927.0" y="397.9" fill="#837242" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">약2.449</text><text x="44.0" y="466.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">MSE의 단위는 목표 단위의 제곱이고, MAE와 RMSE는 원래 단위입니다.</text></svg>