<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="583" viewBox="0 0 1200 583" role="img"><title>값에 확률을 곱하고 열을 더한다</title><desc>기댓값은 실제 가능한 관측값 하나일 필요가 없습니다. 1.5는 확률로 가중한 평균입니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-35 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">값에 확률을 곱하고 열을 더한다</text><rect x="44.0" y="146.0" width="346.7" height="253.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">분포(Distribution)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">X=0: 확률0.25</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">X=2: 확률0.75</text><path d="M395.7 272.5L419.7 272.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 264.5L420.6666666666667 272.5L407.6666666666667 280.5Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="253.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">기댓값(Expected Value)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">0×0.25 + 2×0.75</text><text x="448.7" y="322.5" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">1.5</text><path d="M778.3 272.5L802.3 272.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 264.5L803.3333333333334 272.5L790.3333333333334 280.5Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="253.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">분산(Variance)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">E(X²)=3</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">3−1.5²</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">0.75</text><text x="44.0" y="438.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 확률 가중</text><text x="44.0" y="480.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 중심의 제곱을 뺌</text><text x="44.0" y="522.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">기댓값은 실제 가능한 관측값 하나일 필요가 없습니다. 1.5는 확률로 가중한 평균입니다.</text></svg>