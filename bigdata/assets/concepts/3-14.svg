<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="572" viewBox="0 0 1200 572" role="img"><title>가운데 경계와 양쪽의 가까운 점을 구분합니다</title><desc>가장 바깥의 −3과 3 사이 거리를 마진으로 세지 않습니다. 총 마진과 경계 한쪽 거리는 2배 차이입니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-14 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">가운데 경계와 양쪽의 가까운 점을 구분합니다</text><rect x="44.0" y="146.0" width="346.7" height="289.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">음성 클래스(Negative</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Class)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">점 −3, −1</text><text x="69.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">경계에 가까운 지지점은 −1</text><text x="66.0" y="405.0" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">서포트 벡터 −1</text><rect x="426.7" y="146.0" width="346.7" height="289.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">결정 경계(Decision</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Boundary)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">경계 x=0</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">각 지지점까지 거리는 1</text><text x="448.7" y="405.0" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">지지선 사이 폭 2</text><rect x="809.3" y="146.0" width="346.7" height="289.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">양성 클래스(Positive</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Class)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">점 1, 3</text><text x="834.3" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">경계에 가까운 지지점은 1</text><text x="831.3" y="405.0" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">서포트 벡터 1</text><text x="44.0" y="474.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">가장 바깥의 −3과 3 사이 거리를 마진으로 세지 않습니다. 총 마진과 경계 한쪽 거리는 2배</text><text x="44.0" y="510.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">차이입니다.</text></svg>