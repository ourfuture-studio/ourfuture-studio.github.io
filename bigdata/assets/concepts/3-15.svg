<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img"><title>복잡도 항과 위반 비용을 함께 비교합니다</title><desc>특징공간(Feature Space)이나 정답을 바꾸지 않고 두 후보의 비용만 비교한 예제입니다. 전역 최적 SVM을 찾은 계산은 아닙니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-15 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">복잡도 항과 위반 비용을 함께 비교합니다</text><rect x="44.0" y="146.0" width="346.7" height="253.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">후보 A</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">½‖w‖²=1, Σξ=2</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">목적값 J_A=1+2C</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">C=2이면 5</text><rect x="426.7" y="146.0" width="346.7" height="253.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">후보 B</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">½‖w‖²=3, Σξ=0</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">목적값 J_B=3</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">C=2이면 3</text><rect x="809.3" y="146.0" width="346.7" height="253.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">C만 0.5로 바꾸면</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">A는 1+2×0.5=2</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">B는 그대로 3</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">이번에는 A</text><text x="44.0" y="438.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">특징공간(Feature Space)이나 정답을 바꾸지 않고 두 후보의 비용만 비교한 예제입니다. 전역 최적</text><text x="44.0" y="474.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">SVM을 찾은 계산은 아닙니다.</text></svg>