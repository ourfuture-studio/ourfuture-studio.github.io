<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="491" viewBox="0 0 1200 491" role="img"><title>직접 식별자를 지운 뒤에도 남는 연결 고리</title><desc>화살표는 정보 연결 가능성이다. 후보 수를 모든 외부 지식을 반영한 재식별 확률로 바꾸지 않는다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-20 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">직접 식별자를 지운 뒤에도 남는 연결 고리</text><rect x="44.0" y="146.0" width="346.7" height="244.8" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">공개표(Released Data)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이름은 제거</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">출생일·작은 지역·직업은</text><text x="69.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">남음</text><path d="M395.7 268.4L419.7 268.4" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 260.4L420.6666666666667 268.4L407.6666666666667 276.4Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="244.8" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">외부 자료(External Data)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">같은 속성 조합을 가진 명부</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">주어진 조건에서 후보가 1</text><text x="451.7" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">명</text><path d="M778.3 268.4L802.3 268.4" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 260.4L803.3333333333334 268.4L790.3333333333334 276.4Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="244.8" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">연결 가능성(Linkability)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">한 후보와 연결될 수 있음</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">추가 외부 지식과 제공 환경</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">검토</text><text x="44.0" y="429.8" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">화살표는 정보 연결 가능성이다. 후보 수를 모든 외부 지식을 반영한 재식별 확률로 바꾸지 않는다.</text></svg>