<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img"><title>큰 값 발견 뒤 근거에 따라 처리를 나누기</title><desc>같은 숫자 120도 확인된 원인이 다르면 처리 방향이 달라진다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-07 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">큰 값 발견 뒤 근거에 따라 처리를 나누기</text><rect x="44.0" y="146.0" width="346.7" height="281.2" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">후보 발견(Outlier</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Candidate)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">18·20·21·120건</text><text x="69.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">120이 다른 값보다 큼</text><path d="M395.7 286.6L419.7 286.6" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 278.6L420.6666666666667 286.6L407.6666666666667 294.6Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="281.2" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">원기록 확인(Source</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Verification)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">행사 영수증도 120인가?</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">원기록은 12인데 잘못</text><text x="451.7" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">적었는가?</text><path d="M778.3 286.6L802.3 286.6" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 278.6L803.3333333333334 286.6L790.3333333333334 294.6Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="281.2" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">처리 결정(Data</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Treatment)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">실제 급증이면 보존 검토</text><text x="834.3" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">오류 확인이면 근거를 남겨</text><text x="834.3" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">정정</text><text x="44.0" y="466.2" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 추가 확인</text><text x="44.0" y="508.2" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 근거에 맞는 조치</text><text x="44.0" y="550.2" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">같은 숫자 120도 확인된 원인이 다르면 처리 방향이 달라진다.</text></svg>