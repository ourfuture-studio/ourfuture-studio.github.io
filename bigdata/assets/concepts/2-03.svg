<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img"><title>체중이 누락되는 규칙을 세 가지로 나누기</title><desc>이 분류는 생성 규칙을 알려 준 교육 예다. 관측된 세 행의 빈칸만으로 MAR나 MNAR를 보통 확정할 수 없다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-03 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">체중이 누락되는 규칙을 세 가지로 나누기</text><rect x="44.0" y="146.0" width="346.7" height="352.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">완전 무작위 결측(MCAR,</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Missing Completely at</text><text x="66.0" y="297.4" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Random)</text><text x="69.0" y="343.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">결측 확률이 모든 값과 독립</text><text x="69.0" y="387.9" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">연령·체중 어느 값에도 의존</text><text x="69.0" y="422.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">안 함</text><rect x="426.7" y="146.0" width="346.7" height="352.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">무작위 결측(MAR,</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Missing at Random)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">관측된 연령에 따라 확률이</text><text x="451.7" y="340.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">다름</text><text x="451.7" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">연령을 조건으로 실제</text><text x="451.7" y="419.8" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">체중에는 비의존</text><rect x="809.3" y="146.0" width="346.7" height="352.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">비무작위 결측(MNAR,</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Missing Not at Random</text><text x="831.3" y="297.4" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">)</text><text x="834.3" y="343.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">같은 연령에서도 실제</text><text x="834.3" y="377.9" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">체중에 의존</text><text x="834.3" y="422.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">관측되지 않은 값의 영향이</text><text x="834.3" y="457.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">남음</text><text x="44.0" y="537.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">이 분류는 생성 규칙을 알려 준 교육 예다. 관측된 세 행의 빈칸만으로 MAR나 MNAR를 보통</text><text x="44.0" y="573.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">확정할 수 없다.</text></svg>