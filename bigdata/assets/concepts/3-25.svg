<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="653" viewBox="0 0 1200 653" role="img"><title>차분의 예측을 만든 뒤 마지막 수준에 더합니다</title><desc>MA 항은 과거 관측값의 단순 이동평균이 아니라 과거 혁신(Innovation)의 기여입니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-25 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">차분의 예측을 만든 뒤 마지막 수준에 더합니다</text><rect x="44.0" y="146.0" width="346.7" height="322.6" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">과거 정보</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">과거 차분 w=4</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">과거 혁신 ε=1</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">마지막 수준 y=10</text><path d="M395.7 307.3L419.7 307.3" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 299.3L420.6666666666667 307.3L407.6666666666667 315.3Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="322.6" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">AR·MA 기여</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">자기회귀(AR,</text><text x="451.7" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">Autoregressive): 0.5×4=2</text><text x="451.7" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이동평균(MA, Moving</text><text x="451.7" y="382.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">Average): 0.2×1=0.2</text><text x="448.7" y="436.9" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">차분 예측 2.2</text><path d="M778.3 307.3L802.3 307.3" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 299.3L803.3333333333334 307.3L790.3333333333334 315.3Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="322.6" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">원수준으로 복원</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">새 혁신의 조건부 기대는 0</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">마지막 수준 10에 2.2를</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">더함</text><text x="831.3" y="402.1" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">원수준 예측 12.2</text><text x="44.0" y="507.6" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 조건부 기대 계산</text><text x="44.0" y="549.6" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 1차 차분을 되돌림</text><text x="44.0" y="591.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">MA 항은 과거 관측값의 단순 이동평균이 아니라 과거 혁신(Innovation)의 기여입니다.</text></svg>