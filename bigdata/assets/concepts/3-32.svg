<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img"><title>미리 정한 결합 규칙과 데이터로 학습하는 결합을 구분합니다</title><desc>스태킹과 블렌딩의 이름만 외우기보다 기본 모형과 메타모형이 어느 행을 학습했는지 그려 봅니다. 최종 시험 자료는 메타 학습에 쓰지 않습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-32 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">미리 정한 결합 규칙과 데이터로 학습하는 결합을 구분합니다</text><rect x="44.0" y="146.0" width="346.7" height="365.6" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">보팅(Voting)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">하드: 범주 레이블의 표 수</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">소프트: 예측 확률의 평균</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">결합 규칙을 미리</text><text x="66.0" y="410.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">지정</text><rect x="426.7" y="146.0" width="346.7" height="365.6" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">스태킹(Stacking)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">폴드 외 예측(Out-of-Fold</text><text x="451.7" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">Prediction)</text><text x="451.7" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">메타모형(Meta-Model)에</text><text x="451.7" y="382.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">입력</text><text x="448.7" y="436.9" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">결합 관계를 학습</text><rect x="809.3" y="146.0" width="346.7" height="365.6" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">블렌딩(Blending)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이 글에서는 별도 보류 집합</text><text x="834.3" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">사용</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">그 집합의 예측으로 메타</text><text x="834.3" y="382.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">학습</text><text x="831.3" y="436.9" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">어떤 행으로</text><text x="831.3" y="479.9" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">학습했는지 확인</text><text x="44.0" y="550.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">스태킹과 블렌딩의 이름만 외우기보다 기본 모형과 메타모형이 어느 행을 학습했는지 그려 봅니다.</text><text x="44.0" y="586.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">최종 시험 자료는 메타 학습에 쓰지 않습니다.</text></svg>