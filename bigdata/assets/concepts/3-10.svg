<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="788" viewBox="0 0 1200 788" role="img"><title>네 입력을 직접 대입한 XOR(Exclusive OR) 표</title><desc>h₁=ReLU(s), h₂=ReLU(s−1), s=x₁+x₂로 고정한 구성입니다. 실제 학습을 수행한 결과표가 아닙니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-10 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">네 입력을 직접 대입한 XOR(Exclusive OR) 표</text><rect x="44.0" y="146.0" width="538.0" height="253.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">(x₁,x₂)=(0,0)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">s=0, h₁=0, h₂=0</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">f=h₁−2h₂</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">출력 0</text><rect x="618.0" y="146.0" width="538.0" height="253.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">(x₁,x₂)=(0,1)</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">s=1, h₁=1, h₂=0</text><text x="643.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">f=h₁−2h₂</text><text x="640.0" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">출력 1</text><rect x="44.0" y="435.0" width="538.0" height="253.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="67.0" y="471.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="66.0" y="511.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">(x₁,x₂)=(1,0)</text><text x="69.0" y="556.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">s=1, h₁=1, h₂=0</text><text x="69.0" y="601.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">f=h₁−2h₂</text><text x="66.0" y="656.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">출력 1</text><rect x="618.0" y="435.0" width="538.0" height="253.0" rx="14" fill="#f5f1e8" stroke="#837242" stroke-width="2"/><text x="641.0" y="471.0" fill="#837242" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">D</text><text x="640.0" y="511.0" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">(x₁,x₂)=(1,1)</text><text x="643.0" y="556.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">s=2, h₁=2, h₂=1</text><text x="643.0" y="601.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">f=2−2×1</text><text x="640.0" y="656.3" fill="#837242" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">출력 0</text><text x="44.0" y="727.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">h₁=ReLU(s), h₂=ReLU(s−1), s=x₁+x₂로 고정한 구성입니다. 실제 학습을 수행한 결과표가 아닙니다.</text></svg>