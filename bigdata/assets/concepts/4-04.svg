<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img"><title>같은 TP=3, 다른 분모</title><desc>정밀도의 분모는 TP+FP=4, 재현율의 분모는 TP+FN=5입니다. 전체10을 두 비율의 분모로 쓰지 않습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">4-04 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 TP=3, 다른 분모</text><rect x="44.0" y="146.0" width="538.0" height="208.2" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">참양성(TP, True Positive)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">실제 스팸 · 예측 스팸</text><text x="66.0" y="322.5" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">3</text><rect x="618.0" y="146.0" width="538.0" height="208.2" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">거짓음성(FN, False Negative)</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">실제 스팸 · 예측 정상</text><text x="640.0" y="322.5" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">2</text><rect x="44.0" y="390.2" width="538.0" height="208.2" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="67.0" y="426.2" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="66.0" y="466.2" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">거짓양성(FP, False Positive)</text><text x="69.0" y="511.9" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">실제 정상 · 예측 스팸</text><text x="66.0" y="566.7" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">1</text><rect x="618.0" y="390.2" width="538.0" height="208.2" rx="14" fill="#f5f1e8" stroke="#837242" stroke-width="2"/><text x="641.0" y="426.2" fill="#837242" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">D</text><text x="640.0" y="466.2" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">참음성(TN, True Negative)</text><text x="643.0" y="511.9" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">실제 정상 · 예측 정상</text><text x="640.0" y="566.7" fill="#837242" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">4</text><text x="44.0" y="637.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">정밀도의 분모는 TP+FP=4, 재현율의 분모는 TP+FN=5입니다. 전체10을 두 비율의 분모로 쓰지</text><text x="44.0" y="673.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">않습니다.</text></svg>