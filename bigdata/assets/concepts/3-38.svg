<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="662" viewBox="0 0 1200 662" role="img"><title>한 상태 경로를 따라 초기·방출·전이·방출을 곱합니다</title><desc>숨은 상태 경로는 N,W로 고정하고 관측은 낮음,높음으로 고정했습니다. 다른 경로의 기여를 아직 더하지 않았습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-38 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">한 상태 경로를 따라 초기·방출·전이·방출을 곱합니다</text><rect x="44.0" y="146.0" width="346.7" height="296.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">첫 숨은 상태 N</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">초기 정상 확률 0.8</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">정상에서 낮음 방출 0.9</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">첫 두 기여 0.72</text><path d="M395.7 294.0L419.7 294.0" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 286.0L420.6666666666667 294.0L407.6666666666667 302.0Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="296.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">상태 전이(Transition)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">정상 N → 마모 W</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이 경로의 전이확률 0.1</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">현재 경로를 따라감</text><path d="M778.3 294.0L802.3 294.0" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 286.0L803.3333333333334 294.0L790.3333333333334 302.0Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="296.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">둘째 관측 방출(Emission)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">마모 W에서 높음 확률 0.7</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">0.8×0.9×0.1×0.7</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">경로·관측 결합</text><text x="831.3" y="410.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">0.0504</text><text x="44.0" y="481.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 정상 → 마모</text><text x="44.0" y="523.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 새 상태에서 관측 생성</text><text x="44.0" y="565.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">숨은 상태 경로는 N,W로 고정하고 관측은 낮음,높음으로 고정했습니다. 다른 경로의 기여를 아직</text><text x="44.0" y="601.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">더하지 않았습니다.</text></svg>