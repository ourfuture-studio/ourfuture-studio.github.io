<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="577" viewBox="0 0 1200 577" role="img"><title>예측에서 행동으로 가려면 규칙이 필요하다</title><desc>60은 주어진 단순 정책의 결과입니다. 현실의 최적 발주량을 검증한 숫자가 아닙니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">4-37 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">예측에서 행동으로 가려면 규칙이 필요하다</text><rect x="44.0" y="146.0" width="346.7" height="246.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">수요 예측(Demand</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Forecast)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">내일80개</text><text x="69.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">예측 자체는 발주량이 아님</text><path d="M395.7 269.2L419.7 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 261.2L420.6666666666667 269.2L407.6666666666667 277.2Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="246.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">현재 조건(Current State)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">사용 가능 재고20개</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">입고·폐기 등은 이 예에서</text><text x="451.7" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">제외</text><path d="M778.3 269.2L802.3 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 261.2L803.3333333333334 269.2L790.3333333333334 277.2Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="246.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">지정한 행동 규칙(Action</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Rule)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">max(80−20,0)</text><text x="831.3" y="360.2" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">추가 발주60개</text><text x="44.0" y="431.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 재고 조건 추가</text><text x="44.0" y="473.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 정책 적용</text><text x="44.0" y="515.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">60은 주어진 단순 정책의 결과입니다. 현실의 최적 발주량을 검증한 숫자가 아닙니다.</text></svg>