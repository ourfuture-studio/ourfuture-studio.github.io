<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="618" viewBox="0 0 1200 618" role="img"><title>좌표별 절단이 아니라 벡터 전체를 같은 배율로 줄입니다</title><desc>좌표를 각각 5로 자르는 값 클리핑(Value Clipping)의 (5,5)와는 다른 연산입니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-13 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">좌표별 절단이 아니라 벡터 전체를 같은 배율로 줄입니다</text><rect x="44.0" y="146.0" width="346.7" height="287.8" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">원래 기울기(Gradient)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">g=(6,8)</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">유클리드 노름(Euclidean</text><text x="69.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">Norm) √100</text><text x="66.0" y="402.1" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">길이 10</text><path d="M395.7 289.9L419.7 289.9" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 281.9L420.6666666666667 289.9L407.6666666666667 297.9Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="287.8" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">배율 정하기</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">임계값(Threshold) c=5</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">min(1,5/10)</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">배율 0.5</text><path d="M778.3 289.9L802.3 289.9" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 281.9L803.3333333333334 289.9L790.3333333333334 297.9Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="287.8" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 배율 적용</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">(6,8)×0.5=(3,4)</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">방향은 같고 길이만 줄어듦</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">길이 5</text><text x="44.0" y="472.8" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 길이와 임계값 비교</text><text x="44.0" y="514.8" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 두 좌표에 함께 곱하기</text><text x="44.0" y="556.8" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">좌표를 각각 5로 자르는 값 클리핑(Value Clipping)의 (5,5)와는 다른 연산입니다.</text></svg>