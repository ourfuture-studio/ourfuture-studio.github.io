<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="528" viewBox="0 0 1200 528" role="img"><title>같은 사전학습 지식, 다른 갱신 범위</title><desc>핵심은 이미 학습한 표현을 재사용했는지다. 모든 층을 다시 학습해야만 전이학습인 것은 아니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-17 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 사전학습 지식, 다른 갱신 범위</text><rect x="44.0" y="146.0" width="346.7" height="281.2" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">고정 특징 추출(Feature</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Extraction)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">사전학습 특징 추출기는</text><text x="69.0" y="340.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">고정</text><text x="69.0" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">새 출력층은 새 자료로 학습</text><rect x="426.7" y="146.0" width="346.7" height="281.2" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">미세 조정(Fine-tuning)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">사전학습 가중치에서 시작</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">설정한 층의 가중치를 갱신</text><rect x="809.3" y="146.0" width="346.7" height="281.2" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">무작위 초기화(Random</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Initialization)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">학습된 표현을 재사용하지</text><text x="834.3" y="340.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">않음</text><text x="834.3" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">처음부터 가중치를 학습</text><text x="44.0" y="466.2" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">핵심은 이미 학습한 표현을 재사용했는지다. 모든 층을 다시 학습해야만 전이학습인 것은 아니다.</text></svg>