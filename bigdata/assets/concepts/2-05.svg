<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="491" viewBox="0 0 1200 491" role="img"><title>빈칸·범위 위반·원기록 불일치를 나누기</title><desc>값의 존재와 형식 검사를 통과해도 원기록과 일치하는지는 별도 확인한다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-05 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">빈칸·범위 위반·원기록 불일치를 나누기</text><rect x="44.0" y="146.0" width="346.7" height="244.8" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">완전성(Completeness)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">필수 점수 값이 누락</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">값이 있어야 하는가?</text><rect x="426.7" y="146.0" width="346.7" height="244.8" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">유효성(Validity)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">999는 0~100 정수 규칙</text><text x="451.7" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">위반</text><text x="451.7" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">정한 범위·형식에 맞는가?</text><rect x="809.3" y="146.0" width="346.7" height="244.8" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">정확성(Accuracy)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">80인데 원기록은 60</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">실제 원기록과 일치하는가?</text><text x="44.0" y="429.8" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">값의 존재와 형식 검사를 통과해도 원기록과 일치하는지는 별도 확인한다.</text></svg>