<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="619" viewBox="0 0 1200 619" role="img"><title>경고를 낸 전체 중 A가 차지하는 몫을 구합니다</title><desc>P(A|D)와 P(D|A)는 방향이 다릅니다. 이 표의 확률은 주어진 교육용 모형이며 실제 유형 빈도를 조사한 결과가 아닙니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-28 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">경고를 낸 전체 중 A가 차지하는 몫을 구합니다</text><rect x="44.0" y="146.0" width="346.7" height="253.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">유형별 기본 비율</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">P(A)=0.25, P(B)=0.75</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">경고 가능도는 0.20, 0.04</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">사전확률 × 가능도</text><path d="M395.7 272.5L419.7 272.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 264.5L420.6666666666667 272.5L407.6666666666667 280.5Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="253.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">경고와의 결합확률</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">A와 경고: 0.25×0.20=0.05</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">B와 경고: 0.75×0.04=0.03</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">경고 전체 0.08</text><path d="M778.3 272.5L802.3 272.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 264.5L803.3333333333334 272.5L790.3333333333334 280.5Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="253.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">경고 안의 A 비중</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">분자는 A와 경고 0.05</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">분모는 모든 경고 0.08</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">0.625=62.5%</text><text x="44.0" y="438.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 유형별 기여 계산</text><text x="44.0" y="480.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 관찰한 경고로 조건화</text><text x="44.0" y="522.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">P(A|D)와 P(D|A)는 방향이 다릅니다. 이 표의 확률은 주어진 교육용 모형이며 실제 유형 빈도를</text><text x="44.0" y="558.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">조사한 결과가 아닙니다.</text></svg>