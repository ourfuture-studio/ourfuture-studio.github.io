<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>원시 입력에서 모형 입력으로 한 단계를 거친다</title><desc>14를 곧바로3x+1에 넣은43은 지정한 파이프라인의 출력7과 다릅니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">4-34 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">원시 입력에서 모형 입력으로 한 단계를 거친다</text><rect x="44.0" y="146.0" width="346.7" height="289.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">원시 입력(Raw Input)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">x=14</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">저장 평균10 · 표준편차2</text><path d="M395.7 290.7L419.7 290.7" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 282.7L420.6666666666667 290.7L407.6666666666667 298.7Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="289.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">저장한 표준화(</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Standardization)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">z=(14−10)/2</text><text x="448.7" y="360.2" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">2</text><path d="M778.3 290.7L802.3 290.7" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 282.7L803.3333333333334 290.7L790.3333333333334 298.7Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="289.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">모형 예측(Model</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Prediction)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">ŷ=3z+1</text><text x="834.3" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">3×2+1</text><text x="831.3" y="405.0" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">7</text><text x="44.0" y="474.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 저장된 transform</text><text x="44.0" y="516.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 모형에 전달</text><text x="44.0" y="558.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">14를 곧바로3x+1에 넣은43은 지정한 파이프라인의 출력7과 다릅니다.</text></svg>