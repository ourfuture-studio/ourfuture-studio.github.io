<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="572" viewBox="0 0 1200 572" role="img"><title>클래스별 점수를 만든 다음 같은 합으로 나눕니다</title><desc>독립이라는 가정은 두 특성이 무조건 독립이라는 뜻이 아니라, 클래스 C가 주어졌을 때의 관계입니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-29 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">클래스별 점수를 만든 다음 같은 합으로 나눕니다</text><rect x="44.0" y="146.0" width="346.7" height="289.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">클래스 A</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">사전 0.5 × 첫 특성 0.8</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">× 둘째 특성 0.5</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">점수 0.20</text><rect x="426.7" y="146.0" width="346.7" height="289.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">클래스 B</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">사전 0.5 × 첫 특성 0.4</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">× 둘째 특성 0.5</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">점수 0.10</text><rect x="809.3" y="146.0" width="346.7" height="289.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">사후확률(Posterior</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Probability)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">A의 점수÷두 점수 합</text><text x="834.3" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">0.20÷(0.20+0.10)</text><text x="831.3" y="405.0" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">P(A|x)=2/3</text><text x="44.0" y="474.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">독립이라는 가정은 두 특성이 무조건 독립이라는 뜻이 아니라, 클래스 C가 주어졌을 때의</text><text x="44.0" y="510.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">관계입니다.</text></svg>