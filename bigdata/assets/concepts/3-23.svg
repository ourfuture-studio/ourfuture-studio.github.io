<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="534" viewBox="0 0 1200 534" role="img"><title>반응의 수와 관측 설계가 검정 선택을 바꿉니다</title><desc>시간과 점수를 서로 다른 사람에게 따로 측정한 자료를 임의로 한 사람의 벡터처럼 묶지 않습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-23 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">반응의 수와 관측 설계가 검정 선택을 바꿉니다</text><rect x="44.0" y="146.0" width="346.7" height="287.8" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">독립 집단 · 반응 1개</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">집단 A·B·C의 시간만 비교</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">모평균(Population Mean)</text><text x="69.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">하나씩 비교</text><text x="66.0" y="402.1" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">일원 ANOVA</text><rect x="426.7" y="146.0" width="346.7" height="287.8" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">독립 집단 · 반응 2개</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">같은 사람의 시간·점수를</text><text x="451.7" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">묶음</text><text x="451.7" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">두 성분의 평균벡터를 비교</text><text x="448.7" y="402.1" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">일원 MANOVA</text><rect x="809.3" y="146.0" width="346.7" height="287.8" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 대상의 반복 측정</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">관측 사이의 의존 구조 존재</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">반복측정 설계를 별도로</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">고려</text><text x="831.3" y="402.1" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">설계 추가 검토</text><text x="44.0" y="472.8" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">시간과 점수를 서로 다른 사람에게 따로 측정한 자료를 임의로 한 사람의 벡터처럼 묶지 않습니다.</text></svg>