<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img"><title>요청한 결과물에 따라 책임을 나누기</title><desc>직함만 보지 말고 요청한 결과물을 읽는다. 두 역할은 협업할 수 있지만 같은 검증을 대신하지 않는다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-03 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">요청한 결과물에 따라 책임을 나누기</text><rect x="44.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">DB 운영·보호(Database Administration)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">권한·백업·복구 계획</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">자료를 계속 사용할 수 있게 유지</text><rect x="618.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">모형 개발(Model Development)</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이탈 확률을 예측</text><text x="643.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">정해 둔 평가자료에서 오차 확인</text><text x="44.0" y="395.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">직함만 보지 말고 요청한 결과물을 읽는다. 두 역할은 협업할 수 있지만 같은 검증을 대신하지</text><text x="44.0" y="431.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">않는다.</text></svg>