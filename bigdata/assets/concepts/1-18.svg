<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img"><title>좋은 점수와 필수 조건 충족을 따로 보기</title><desc>두 조건은 자체 사례에서 정한 요구다. 한 조건을 고쳐도 다른 미충족 조건이 자동으로 사라지지 않는다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">1-18 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">좋은 점수와 필수 조건 충족을 따로 보기</text><rect x="44.0" y="146.0" width="538.0" height="253.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">응답 시간(Latency)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">요구: 2초 이내</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">후보 가정값: 8초</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">시간 조건 미충족</text><rect x="618.0" y="146.0" width="538.0" height="253.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">데이터 전송(Data Transfer)</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">요구: 외부 전송 금지</text><text x="643.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">후보: 외부 전송 필요</text><text x="640.0" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">전송 조건 미충족</text><text x="44.0" y="438.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">두 조건은 자체 사례에서 정한 요구다. 한 조건을 고쳐도 다른 미충족 조건이 자동으로 사라지지</text><text x="44.0" y="474.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">않는다.</text></svg>