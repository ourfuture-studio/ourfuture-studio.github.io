<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="605" viewBox="0 0 1200 605" role="img"><title>자신을 포함한 이웃 수로 네 점의 역할을 구분합니다</title><desc>이 패널은 역할 정리표입니다. 가로 배치가 실제 거리 비율을 나타내지는 않습니다. 원래 1차원 좌표와 반경을 함께 읽습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-20 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">자신을 포함한 이웃 수로 네 점의 역할을 구분합니다</text><rect x="44.0" y="146.0" width="251.0" height="322.6" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">좌표 0</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">반경 0.11 안에 0,</text><text x="69.0" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">0.1</text><text x="69.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이웃 수 2 &lt; 최소</text><text x="69.0" y="382.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">수 3</text><text x="66.0" y="436.9" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">경계점</text><rect x="331.0" y="146.0" width="251.0" height="322.6" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="354.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="353.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">좌표 0.1</text><text x="356.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">반경 안에 0, 0.1,</text><text x="356.0" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">0.2</text><text x="356.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이웃 수 3 ≥ 최소</text><text x="356.0" y="382.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">수 3</text><text x="353.0" y="436.9" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">핵심점</text><rect x="618.0" y="146.0" width="251.0" height="322.6" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="641.0" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="640.0" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">좌표 0.2</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">반경 안에 0.1, 0.2</text><text x="643.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">핵심점 0.1과 이웃</text><text x="640.0" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">경계점</text><rect x="905.0" y="146.0" width="251.0" height="322.6" rx="14" fill="#f5f1e8" stroke="#837242" stroke-width="2"/><text x="928.0" y="182.0" fill="#837242" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">D</text><text x="927.0" y="222.0" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">좌표 2</text><text x="930.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">반경 안에 자신만</text><text x="930.0" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">존재</text><text x="930.0" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">어느 핵심점의</text><text x="930.0" y="382.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">이웃도 아님</text><text x="927.0" y="436.9" fill="#837242" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">잡음</text><text x="44.0" y="507.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">이 패널은 역할 정리표입니다. 가로 배치가 실제 거리 비율을 나타내지는 않습니다. 원래 1차원</text><text x="44.0" y="543.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">좌표와 반경을 함께 읽습니다.</text></svg>