<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="613" viewBox="0 0 1200 613" role="img"><title>중심에 오차한계를 양쪽으로 붙이기</title><desc>같은 자료에서 신뢰수준을 높이면 임계값이 커져 구간이 넓어진다. 개별 값의 포함 범위와는 다르다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-02 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">중심에 오차한계를 양쪽으로 붙이기</text><rect x="44.0" y="146.0" width="346.7" height="246.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">표본 요약(Sample</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Summary)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">평균 40 · 표본 SD 10</text><text x="69.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">n=25, 자유도 24</text><path d="M395.7 269.2L419.7 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 261.2L420.6666666666667 269.2L407.6666666666667 277.2Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="246.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">평균의 표준오차(</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Standard Error)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">10 / √25 = 2</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">95% t임계값 약 2.064</text><path d="M778.3 269.2L802.3 269.2" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 261.2L803.3333333333334 269.2L790.3333333333334 277.2Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="246.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">95% t신뢰구간(t</text><text x="831.3" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Confidence Interval)</text><text x="834.3" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">40 ± 2.064×2</text><text x="834.3" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">약 [35.872, 44.128]</text><text x="44.0" y="431.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 표준오차</text><text x="44.0" y="473.4" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 임계값 × SE</text><text x="44.0" y="515.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">같은 자료에서 신뢰수준을 높이면 임계값이 커져 구간이 넓어진다. 개별 값의 포함 범위와는</text><text x="44.0" y="551.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">다르다.</text></svg>