<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img"><title>두 변수 묶음을 각각 하나의 점수로 만듭니다</title><desc>이 숫자는 고정한 가중치로 한 사람의 점수를 계산한 예입니다. 최적 CCA 가중치를 적합하거나 상관계수를 추정한 결과는 아닙니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">3-24 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">두 변수 묶음을 각각 하나의 점수로 만듭니다</text><rect x="44.0" y="146.0" width="346.7" height="365.6" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">시험 묶음 X</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">X=(2,4)</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">U=0.5X₁+0.5X₂</text><text x="66.0" y="367.3" fill="#39776a" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">U=3</text><rect x="426.7" y="146.0" width="346.7" height="365.6" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">직무 묶음 Y</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">Y=(1,3,2)</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">V=Y₁+Y₂−Y₃</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">V=2</text><rect x="809.3" y="146.0" width="346.7" height="365.6" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">여러 사람의 U·V 열</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">한 사람의 (3,2)만으로는</text><text x="834.3" y="302.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">부족</text><text x="834.3" y="347.3" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">두 점수 열 사이의 상관을</text><text x="834.3" y="382.1" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">봄</text><text x="831.3" y="436.9" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">관계는 여러</text><text x="831.3" y="479.9" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">관측으로</text><text x="44.0" y="550.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">이 숫자는 고정한 가중치로 한 사람의 점수를 계산한 예입니다. 최적 CCA 가중치를 적합하거나</text><text x="44.0" y="586.6" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">상관계수를 추정한 결과는 아닙니다.</text></svg>