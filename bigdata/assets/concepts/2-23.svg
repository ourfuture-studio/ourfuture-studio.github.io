<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="564" viewBox="0 0 1200 564" role="img"><title>숫자가 같아도 가능한 해석은 다르다</title><desc>섭씨의 영점은 온도 부재가 아닙니다. 의미 있는 영점이 있는 중량과 같은 배율 해석을 적용하지 않습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-23 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">숫자가 같아도 가능한 해석은 다르다</text><rect x="44.0" y="146.0" width="251.0" height="281.2" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">명목척도(</text><text x="66.0" y="259.7" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Nominal Scale)</text><text x="69.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">색상 코드 1·2</text><text x="69.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">같은 범주인가?</text><rect x="331.0" y="146.0" width="251.0" height="281.2" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="354.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="353.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">서열척도(Ordinal</text><text x="353.0" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Scale)</text><text x="356.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">만족도 낮음·높음</text><text x="356.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">어느 쪽이</text><text x="356.0" y="385.0" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">앞서는가?</text><rect x="618.0" y="146.0" width="251.0" height="281.2" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="641.0" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="640.0" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">등간척도(Interval</text><text x="640.0" y="259.7" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Scale)</text><text x="643.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">섭씨 10·20℃</text><text x="643.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">차이 10℃</text><rect x="905.0" y="146.0" width="251.0" height="281.2" rx="14" fill="#f5f1e8" stroke="#837242" stroke-width="2"/><text x="928.0" y="182.0" fill="#837242" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">D</text><text x="927.0" y="222.0" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">비율척도(Ratio</text><text x="927.0" y="259.7" fill="#837242" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Scale)</text><text x="930.0" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">중량 10·20kg</text><text x="930.0" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">두 배 중량</text><text x="44.0" y="466.2" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">섭씨의 영점은 온도 부재가 아닙니다. 의미 있는 영점이 있는 중량과 같은 배율 해석을 적용하지</text><text x="44.0" y="502.2" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">않습니다.</text></svg>