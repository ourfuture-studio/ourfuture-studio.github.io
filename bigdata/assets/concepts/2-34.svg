<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="572" viewBox="0 0 1200 572" role="img"><title>첫 빨강 뒤 주머니가 달라진다</title><desc>첫 빨강이라는 경로를 따라가며 다음 주머니를 그립니다. 복원하고 매번 독립적으로 고르는 조건을 함께 확인합니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-34 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">첫 빨강 뒤 주머니가 달라진다</text><rect x="44.0" y="146.0" width="346.7" height="289.4" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">처음 주머니</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">빨강2 · 파랑3</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">첫 빨강 확률2/5</text><rect x="426.7" y="146.0" width="346.7" height="289.4" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">비복원(Without</text><text x="448.7" y="259.7" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">Replacement)</text><text x="451.7" y="305.4" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">빨강1 · 파랑3 남음</text><text x="451.7" y="350.2" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">다음 빨강 확률1/4</text><text x="448.7" y="405.0" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">두 번 빨강0.10</text><rect x="809.3" y="146.0" width="346.7" height="289.4" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">C</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">복원(With Replacement)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">빨강2 · 파랑3 유지</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">다음 빨강 확률2/5</text><text x="831.3" y="367.3" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">두 번 빨강0.16</text><text x="44.0" y="474.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">첫 빨강이라는 경로를 따라가며 다음 주머니를 그립니다. 복원하고 매번 독립적으로 고르는 조건을</text><text x="44.0" y="510.4" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">함께 확인합니다.</text></svg>