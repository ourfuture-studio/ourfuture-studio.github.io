<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>조건이 표본공간을 좁힌다</title><desc>P(B|불량)과 P(불량|B)는 조건과 분모가 다릅니다. 화살표의 방향을 바꾸어 읽지 않습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-33 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">조건이 표본공간을 좁힌다</text><rect x="44.0" y="146.0" width="346.7" height="210.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">전체 생산품</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">A 100개 · B 100개</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">총200개</text><path d="M395.7 251.0L419.7 251.0" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 243.0L420.6666666666667 251.0L407.6666666666667 259.0Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="210.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">불량이라는 조건</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">A 불량10개 · B 불량30개</text><text x="448.7" y="322.5" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">분모40개</text><path d="M778.3 251.0L802.3 251.0" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 243.0L803.3333333333334 251.0L790.3333333333334 259.0Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="210.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">그중 B공장</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">30 ÷ 40</text><text x="831.3" y="322.5" fill="#4a6781" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">75%</text><text x="44.0" y="395.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 불량만 남김</text><text x="44.0" y="437.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. B의 몫 계산</text><text x="44.0" y="479.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">P(B|불량)과 P(불량|B)는 조건과 분모가 다릅니다. 화살표의 방향을 바꾸어 읽지 않습니다.</text></svg>