<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="619" viewBox="0 0 1200 619" role="img"><title>세 자료는 맡은 일이 다르다</title><desc>훈련 점수가 높은 후보가 검증에서도 높은 것은 아닙니다. 이 표의 시험 점수는 아직 주어지지 않았습니다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-21 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">세 자료는 맡은 일이 다르다</text><rect x="44.0" y="146.0" width="346.7" height="253.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">01</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">훈련(Training)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">모형의 계수를 학습</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">A 99% · B 90%</text><path d="M395.7 272.5L419.7 272.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M407.6666666666667 264.5L420.6666666666667 272.5L407.6666666666667 280.5Z" fill="#628d7c"/><rect x="426.7" y="146.0" width="346.7" height="253.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="449.7" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">02</text><text x="448.7" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">검증(Validation)</text><text x="451.7" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">사전에 정한 기준으로 선택</text><text x="451.7" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">A 70% · B 80%</text><text x="448.7" y="367.3" fill="#ae6743" font-size="32" font-family="Malgun Gothic,sans-serif" font-weight="700">이 예에서는 B</text><path d="M778.3 272.5L802.3 272.5" stroke="#628d7c" stroke-width="3" fill="none"/><path d="M790.3333333333334 264.5L803.3333333333334 272.5L790.3333333333334 280.5Z" fill="#628d7c"/><rect x="809.3" y="146.0" width="346.7" height="253.0" rx="14" fill="#eef2f8" stroke="#4a6781" stroke-width="2"/><text x="832.3" y="182.0" fill="#4a6781" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">03</text><text x="831.3" y="222.0" fill="#4a6781" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">시험(Test)</text><text x="834.3" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">고른 뒤 별도로 평가</text><text x="834.3" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">선택 과정에는 미사용</text><text x="44.0" y="438.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">1. 후보 생성</text><text x="44.0" y="480.0" fill="#5c7569" font-size="23" font-family="Malgun Gothic,sans-serif" font-weight="400">2. 선택 후 평가</text><text x="44.0" y="522.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">훈련 점수가 높은 후보가 검증에서도 높은 것은 아닙니다. 이 표의 시험 점수는 아직 주어지지</text><text x="44.0" y="558.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">않았습니다.</text></svg>