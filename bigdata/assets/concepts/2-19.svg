<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img"><title>같은 원래 열에서 두 종류의 결과 만들기</title><desc>이 예제의 선형결합 계수는 주어진 값이다. 분산 최대화로 학습한 PCA 주성분이라고 단정하지 않는다.</desc><rect width="100%" height="100%" fill="#faf9f4"/><text x="44.0" y="36.0" fill="#5b766a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="400">2-19 · 개념을 관계로 보기</text><text x="44.0" y="85.0" fill="#203e39" font-size="34" font-family="Malgun Gothic,sans-serif" font-weight="700">같은 원래 열에서 두 종류의 결과 만들기</text><rect x="44.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#edf5f0" stroke="#39776a" stroke-width="2"/><text x="67.0" y="182.0" fill="#39776a" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">A</text><text x="66.0" y="222.0" fill="#39776a" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">특성 선택(Feature Selection)</text><text x="69.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">x1과 x4를 그대로 유지</text><text x="69.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">x1=3, x4=7 → [3,7]</text><rect x="618.0" y="146.0" width="538.0" height="210.0" rx="14" fill="#fff4e9" stroke="#ae6743" stroke-width="2"/><text x="641.0" y="182.0" fill="#ae6743" font-size="18" font-family="Malgun Gothic,sans-serif" font-weight="700">B</text><text x="640.0" y="222.0" fill="#ae6743" font-size="26" font-family="Malgun Gothic,sans-serif" font-weight="700">특성 추출(Feature Extraction)</text><text x="643.0" y="267.7" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">기존 값을 선형결합</text><text x="643.0" y="312.5" fill="#203e39" font-size="24" font-family="Malgun Gothic,sans-serif" font-weight="400">0.6×3+0.8×4 → z=5</text><text x="44.0" y="395.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">이 예제의 선형결합 계수는 주어진 값이다. 분산 최대화로 학습한 PCA 주성분이라고 단정하지</text><text x="44.0" y="431.0" fill="#526d60" font-size="25" font-family="Malgun Gothic,sans-serif" font-weight="400">않는다.</text></svg>