<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="982" viewBox="0 0 1200 982" role="img"><title>프로세스(Process)와 스레드(Thread)의 공유 범위</title><desc>프로세스P의 T1·T2는 코드·힙을 공유하며 각자 PC·레지스터·스택을 가진다. 공유 메모리를 별도로 설정하지 않은 프로세스Q는 별도 가상 주소 공간이다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-3-22 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">프로세스(Process)와 스레드(Thread)의 공유 범위</text><rect x="44" y="145.44" width="730" height="600" rx="12" fill="#fff" stroke="#315f97" stroke-width="2"/><text x="64" y="183.44" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#315f97" text-anchor="start">프로세스 P(Process)</text><rect x="64" y="210.44" width="690" height="130" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="82" y="246.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">공유 주소 공간(Shared Address Space)</text><text x="82" y="292.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">코드(Code) · 힙(Heap)</text><rect x="64.0" y="380.44" width="335.0" height="325" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="82.0" y="416.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">스레드 T1(Thread)</text><text x="82.0" y="462.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">프로그램 카운터(PC,</text><text x="82.0" y="497.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">Program Counter) ·</text><text x="82.0" y="532.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">레지스터(Registers) · 스택(</text><text x="82.0" y="567.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">Stack)</text><rect x="419.0" y="380.44" width="335.0" height="325" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="437.0" y="416.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">스레드 T2(Thread)</text><text x="437.0" y="462.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">프로그램 카운터(PC,</text><text x="437.0" y="497.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">Program Counter) ·</text><text x="437.0" y="532.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">레지스터(Registers) · 스택(</text><text x="437.0" y="567.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">Stack)</text><rect x="816" y="145.44" width="340" height="600" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="834" y="181.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">별도 프로세스 Q</text><text x="834" y="227.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">명시적 공유 메모리 설정</text><text x="834" y="262.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">없는 별도 가상 주소 공간(</text><text x="834" y="297.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">Virtual Address Space)</text><text x="44" y="789.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">각 스레드의 스택이 별도로 있어도 같은 주소 공간 안입니다. 주소를 공개한 경우의 접근·수명·동기화</text><text x="44" y="823.5200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">문제는 별도로 다룹니다.</text><text x="44" y="919.6" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">개별 스택과 공유 주소 공간은 동시에 성립합니다.</text></svg>