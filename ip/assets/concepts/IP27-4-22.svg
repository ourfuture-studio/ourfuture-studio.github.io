<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="997" viewBox="0 0 1200 997" role="img"><title>컨테이너(Container)·가상머신(Virtual Machine)의 커널</title><desc>같은 호스트의 컨테이너C1·C2는 커널K를 공유한다. 서로 다른VM의 앱은G1·G2를 각각 사용하고 한VM안의 컨테이너둘은게스트커널G1을 공유한다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-4-22 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">컨테이너(Container)·가상머신(Virtual Machine)의 커널</text><rect x="44" y="145.44" width="350" height="600" rx="12" fill="#fff" stroke="#315f97" stroke-width="2"/><text x="64" y="187.44" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#315f97" text-anchor="start">같은 Linux 호스트</text><rect x="59" y="243.78" width="150.0" height="165" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="77" y="279.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">앱 A /</text><text x="77" y="316.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">컨테이너</text><text x="77" y="353.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">C1</text><rect x="229.0" y="243.78" width="150.0" height="165" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="247.0" y="279.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">앱 B /</text><text x="247.0" y="316.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">컨테이너</text><text x="247.0" y="353.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">C2</text><rect x="59" y="433.78" width="320" height="115" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="77" y="469.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">호스트 커널 K(Host</text><text x="77" y="506.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">Kernel)</text><rect x="59" y="572.78" width="320" height="110" rx="12" fill="#f4eff9" stroke="#765490" stroke-width="2"/><text x="77" y="608.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#765490" text-anchor="start">물리 서버(Hardware)</text><rect x="425" y="145.44" width="350" height="600" rx="12" fill="#fff" stroke="#a45d30" stroke-width="2"/><text x="445" y="187.44" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#a45d30" text-anchor="start">서로 다른 VM</text><rect x="440" y="243.78" width="150.0" height="165" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="458" y="279.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">앱 A /</text><text x="458" y="316.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">게스트</text><text x="458" y="353.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">OS·G1</text><rect x="610.0" y="243.78" width="150.0" height="165" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="628.0" y="279.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">앱 B /</text><text x="628.0" y="316.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">게스트</text><text x="628.0" y="353.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">OS·G2</text><rect x="440" y="433.78" width="320" height="115" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="458" y="469.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">하이퍼바이저(</text><text x="458" y="506.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">Hypervisor)</text><rect x="440" y="572.78" width="320" height="110" rx="12" fill="#f4eff9" stroke="#765490" stroke-width="2"/><text x="458" y="608.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#765490" text-anchor="start">물리 서버(Hardware)</text><rect x="806" y="145.44" width="350" height="600" rx="12" fill="#fff" stroke="#28766a" stroke-width="2"/><text x="826" y="187.44" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#28766a" text-anchor="start">한 VM 안의 컨테이너</text><rect x="821" y="243.78" width="150.0" height="165" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="839" y="279.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">앱 A /</text><text x="839" y="316.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">컨테이너</text><text x="839" y="353.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">C1</text><rect x="991.0" y="243.78" width="150.0" height="165" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="1009.0" y="279.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">앱 B /</text><text x="1009.0" y="316.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">컨테이너</text><text x="1009.0" y="353.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">C2</text><rect x="821" y="433.78" width="320" height="115" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="839" y="469.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">게스트 커널 G1(Guest</text><text x="839" y="506.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">Kernel)</text><rect x="821" y="572.78" width="320" height="110" rx="12" fill="#f4eff9" stroke="#765490" stroke-width="2"/><text x="839" y="608.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#765490" text-anchor="start">VM · 하이퍼바이저 ·</text><text x="839" y="645.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#765490" text-anchor="start">물리 서버</text><text x="44" y="804.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">일반 Linux 컨테이너로 한정한 배치 비교입니다. 컨테이너가 VM 안에 있으면 그 VM의 게스트 커널을</text><text x="44" y="838.5200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">공유합니다. 보안성·성능 우열을 측정한 그림이 아닙니다.</text><text x="44" y="934.6" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">컨테이너가 VM 안에서 실행되면 그 VM의 게스트 커널을 공유합니다.</text></svg>