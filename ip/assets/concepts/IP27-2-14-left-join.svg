<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>LEFT JOIN: 조건을 ON에 둘 때와 WHERE에 둘 때</title><desc>고객 1·2·3과 구매 11(1,결제),12(1,미결제),13(2,미결제). ON에 paid=1을 두면 (1,11),(2,NULL),(3,NULL)이고 WHERE에 두면 (1,11)만 남는다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-2-14 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">LEFT JOIN: 조건을 ON에 둘 때와 WHERE에 둘 때</text><rect x="60" y="130" width="150" height="56" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="135.0" y="165.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">구매 id</text><rect x="210" y="130" width="150" height="56" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="285.0" y="165.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">고객</text><rect x="360" y="130" width="150" height="56" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="435.0" y="165.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">paid</text><rect x="60" y="186" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="135.0" y="221.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">11</text><rect x="210" y="186" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="285.0" y="221.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">1</text><rect x="360" y="186" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="435.0" y="221.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">1</text><rect x="60" y="242" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="135.0" y="277.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">12</text><rect x="210" y="242" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="285.0" y="277.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">1</text><rect x="360" y="242" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="435.0" y="277.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">0</text><rect x="60" y="298" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="135.0" y="333.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">13</text><rect x="210" y="298" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="285.0" y="333.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">2</text><rect x="360" y="298" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="435.0" y="333.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">0</text><rect x="560" y="130" width="150" height="56" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="635.0" y="165.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">고객 id</text><rect x="560" y="186" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="635.0" y="221.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">1</text><rect x="560" y="242" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="635.0" y="277.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">2</text><rect x="560" y="298" width="150" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="635.0" y="333.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">3</text><text x="780" y="200.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">Customer c LEFT JOIN</text><text x="780" y="223.4" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">Purchase p ON c.id=p.customer_id …</text><text x="60" y="400.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#28766a" text-anchor="start">① ON … AND p.paid=1</text><rect x="60" y="420" width="160" height="56" rx="0" fill="#28766a" stroke="#28766a" stroke-width="1" /><text x="140.0" y="455.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">c.id</text><rect x="220" y="420" width="160" height="56" rx="0" fill="#28766a" stroke="#28766a" stroke-width="1" /><text x="300.0" y="455.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">p.id</text><rect x="60" y="476" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="140.0" y="511.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">1</text><rect x="220" y="476" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="300.0" y="511.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">11</text><rect x="60" y="532" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="140.0" y="567.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">2</text><rect x="220" y="532" width="160" height="56" rx="0" fill="#edf7f2" stroke="#c9d6da" stroke-width="1" /><text x="300.0" y="567.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">NULL</text><rect x="60" y="588" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="140.0" y="623.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">3</text><rect x="220" y="588" width="160" height="56" rx="0" fill="#edf7f2" stroke="#c9d6da" stroke-width="1" /><text x="300.0" y="623.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">NULL</text><text x="60" y="680.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="start">결제 구매만 연결하고</text><text x="60" y="706.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="start">고객 셋은 모두 보존</text><text x="640" y="400.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#a45d30" text-anchor="start">② ON 뒤 WHERE p.paid=1</text><rect x="640" y="420" width="160" height="56" rx="0" fill="#a45d30" stroke="#a45d30" stroke-width="1" /><text x="720.0" y="455.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">c.id</text><rect x="800" y="420" width="160" height="56" rx="0" fill="#a45d30" stroke="#a45d30" stroke-width="1" /><text x="880.0" y="455.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">p.id</text><rect x="640" y="476" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="720.0" y="511.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">1</text><rect x="800" y="476" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="880.0" y="511.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">11</text><text x="640" y="560.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="start">먼저 모두 연결: (1,11) (1,12) (2,13) (3,NULL)</text><text x="640" y="586.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="start">그다음 paid=1이 TRUE인 행만 남김</text><text x="640" y="612.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="start">→ 0인 행과 NULL 행이 모두 빠짐</text><rect x="44" y="748" width="1112" height="56" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="1" /><text x="600.0" y="784.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">ON은 '무엇을 연결할지', WHERE는 '연결된 결과에서 무엇을 남길지'를 정한다.</text></svg>