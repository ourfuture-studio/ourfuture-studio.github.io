<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="881" viewBox="0 0 1200 881" role="img"><title>교착상태(Deadlock)를 만드는 대기 순환</title><desc>T1은 A를 보유하며 T2의 B를 기다리고 T2는 B를 보유하며 T1의 A를 기다린다. 대기 그래프의 T1→T2→T1 순환을 파란색과 주황색으로 표시한다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-2-22 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">교착상태(Deadlock)를 만드는 대기 순환</text><rect x="70" y="220.44" width="390" height="170" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="88" y="256.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">트랜잭션 T1(Transaction)</text><text x="88" y="302.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">A 보유 / B 요청</text><rect x="740" y="220.44" width="390" height="170" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="758" y="256.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">트랜잭션 T2(Transaction)</text><text x="758" y="302.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">B 보유 / A 요청</text><path d="M460.0,270.4 L740.0,270.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M728.3513175321682 276.21132539055174 L740 270.44 L728.3513175321682 264.66867460944826 Z" fill="#315f97"/><text x="600" y="240.44" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#315f97" text-anchor="middle">T1 → T2 대기</text><path d="M740.0,360.4 L460.0,360.4" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M471.6486824678318 354.66867460944826 L460 360.44 L471.6486824678318 366.21132539055174 Z" fill="#a45d30"/><text x="600" y="410.44" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#a45d30" text-anchor="middle">T2 → T1 대기</text><rect x="44" y="495.44" width="1112" height="149" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="62" y="531.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">순환 대기(Circular Wait)</text><text x="62" y="577.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">화살표는 “기다리는 거래 → 잠금 보유 거래”입니다. 이 명시적 배타 잠금 모형에서는 T1 → T2 → T1</text><text x="62" y="612.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">의 순환이 교착(Deadlock)을 만듭니다.</text><text x="44" y="688.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">커밋·중단·타임아웃·교착 탐지를 아직 수행하지 않은 상태입니다. 실제 제품이 어느 거래를 중단할지는</text><text x="44" y="722.5200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">이 그림만으로 정하지 않습니다.</text><text x="44" y="818.6" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">대기 간선은 기다리는 거래 → 잠금 보유 거래로 그립니다.</text></svg>