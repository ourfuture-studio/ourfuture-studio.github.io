<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="833" viewBox="0 0 1200 833" role="img"><title>스텁(Stub)·드라이버(Driver)의 호출 방향</title><desc>시험 대상 B가 호출하는 하위 C의 대체물은 스텁이며, 상위 A 대신 B를 호출하는 대체물은 드라이버다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-1-28 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">스텁(Stub)·드라이버(Driver)의 호출 방향</text><text x="44" y="165.44" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#203d43" text-anchor="start">C가 미구현: 시험 대상이 호출하는 대체물</text><rect x="44" y="195.44" width="326" height="170" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="62" y="231.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">실제 상위 모듈 A</text><text x="62" y="277.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">A가 B를 호출</text><rect x="425" y="195.44" width="326" height="170" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="443" y="231.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">시험 대상 모듈 B</text><text x="443" y="277.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">Module Under Test</text><rect x="806" y="195.44" width="326" height="170" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="824" y="231.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">스텁 X(Stub)</text><text x="824" y="277.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">하위 C의 응답을 대신</text><path d="M376.0,280.4 L419.0,280.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M407.3513175321682 286.21132539055174 L419 280.44 L407.3513175321682 274.66867460944826 Z" fill="#315f97"/><path d="M757.0,280.4 L800.0,280.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M788.3513175321682 286.21132539055174 L800 280.44 L788.3513175321682 274.66867460944826 Z" fill="#315f97"/><text x="44" y="430.44" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#203d43" text-anchor="start">A가 미구현: 시험 대상을 호출하는 대체물</text><rect x="44" y="460.44" width="326" height="170" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="62" y="496.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">드라이버 X(Driver)</text><text x="62" y="542.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">상위 A 대신 입력·호출</text><rect x="425" y="460.44" width="326" height="170" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="443" y="496.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">시험 대상 모듈 B</text><text x="443" y="542.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">Module Under Test</text><rect x="806" y="460.44" width="326" height="170" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="824" y="496.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">실제 하위 모듈 C</text><text x="824" y="542.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">B의 호출을 받음</text><path d="M376.0,545.4 L419.0,545.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M407.3513175321682 551.2113253905518 L419 545.44 L407.3513175321682 539.6686746094483 Z" fill="#315f97"/><path d="M757.0,545.4 L800.0,545.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M788.3513175321682 551.2113253905518 L800 545.44 L788.3513175321682 539.6686746094483 Z" fill="#315f97"/><text x="44" y="674.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">스텁과 드라이버의 역할은 시험 대상으로 정한 모듈을 기준으로 판단합니다.</text><text x="44" y="770.5200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">시험 대상을 부르면 드라이버, 시험 대상이 부르는 의존성을 대신하면 스텁입니다.</text></svg>