<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="867" viewBox="0 0 1200 867" role="img"><title>포함(Include)·확장(Extend)의 화살표</title><desc>대출 신청과 대출 연장에서 본인 확인으로 향하는 include 화살표, 할인 쿠폰 적용에서 주문 완료로 향하는 extend 화살표를 구분한다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-1-03 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">포함(Include)·확장(Extend)의 화살표</text><rect x="44" y="145.44" width="530" height="136" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="62" y="181.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">포함(Include)</text><text x="62" y="227.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">각 대출 동작은 본인 확인을 포함</text><rect x="626" y="145.44" width="530" height="136" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="644" y="181.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">확장(Extend)</text><text x="644" y="227.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">쿠폰 적용에서 기본 주문으로 화살표</text><ellipse cx="160.0" cy="370.44" rx="105.0" ry="50.0" fill="#fff" stroke="#315f97" stroke-width="2"/><text x="160.0" y="378.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">대출 신청</text><ellipse cx="160.0" cy="530.44" rx="105.0" ry="50.0" fill="#fff" stroke="#315f97" stroke-width="2"/><text x="160.0" y="538.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">대출 연장</text><ellipse cx="485.0" cy="450.44" rx="110.0" ry="50.0" fill="#fff" stroke="#315f97" stroke-width="2"/><text x="485.0" y="458.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">본인 확인</text><path d="M265.00,370.44 L271.89,374.51" fill="none" stroke="#315f97" stroke-width="3"/><path d="M277.05,377.56 L283.94,381.63" fill="none" stroke="#315f97" stroke-width="3"/><path d="M289.11,384.68 L295.99,388.75" fill="none" stroke="#315f97" stroke-width="3"/><path d="M301.16,391.81 L308.05,395.88" fill="none" stroke="#315f97" stroke-width="3"/><path d="M313.21,398.93 L320.10,403.00" fill="none" stroke="#315f97" stroke-width="3"/><path d="M325.26,406.05 L332.15,410.12" fill="none" stroke="#315f97" stroke-width="3"/><path d="M337.32,413.17 L344.21,417.24" fill="none" stroke="#315f97" stroke-width="3"/><path d="M349.37,420.30 L356.26,424.37" fill="none" stroke="#315f97" stroke-width="3"/><path d="M361.42,427.42 L368.31,431.49" fill="none" stroke="#315f97" stroke-width="3"/><path d="M373.48,434.54 L375.00,435.44" fill="none" stroke="#315f97" stroke-width="3"/><path d="M362.03529784870415 434.4826609126411 L375 435.44 L367.907382640693 424.5452866492754" fill="none" stroke="#315f97" stroke-width="3"/><path d="M265.00,530.44 L271.89,526.37" fill="none" stroke="#315f97" stroke-width="3"/><path d="M277.05,523.32 L283.94,519.25" fill="none" stroke="#315f97" stroke-width="3"/><path d="M289.11,516.20 L295.99,512.13" fill="none" stroke="#315f97" stroke-width="3"/><path d="M301.16,509.07 L308.05,505.00" fill="none" stroke="#315f97" stroke-width="3"/><path d="M313.21,501.95 L320.10,497.88" fill="none" stroke="#315f97" stroke-width="3"/><path d="M325.26,494.83 L332.15,490.76" fill="none" stroke="#315f97" stroke-width="3"/><path d="M337.32,487.71 L344.21,483.64" fill="none" stroke="#315f97" stroke-width="3"/><path d="M349.37,480.58 L356.26,476.51" fill="none" stroke="#315f97" stroke-width="3"/><path d="M361.42,473.46 L368.31,469.39" fill="none" stroke="#315f97" stroke-width="3"/><path d="M373.48,466.34 L375.00,465.44" fill="none" stroke="#315f97" stroke-width="3"/><path d="M367.907382640693 476.3347133507246 L375 465.44 L362.03529784870415 466.3973390873589" fill="none" stroke="#315f97" stroke-width="3"/><text x="267" y="342.44" font-family="Malgun Gothic,sans-serif" font-size="20" font-weight="400" fill="#315f97" text-anchor="start">«include»</text><ellipse cx="760.0" cy="422.94" rx="110.0" ry="57.5" fill="#fff" stroke="#315f97" stroke-width="2"/><text x="760.0" y="413.94" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">할인 쿠폰</text><text x="760.0" y="447.94" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">적용</text><ellipse cx="1040.0" cy="422.94" rx="110.0" ry="57.5" fill="#fff" stroke="#315f97" stroke-width="2"/><text x="1040.0" y="430.94" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">주문 완료</text><path d="M870.00,423.44 L878.00,423.44" fill="none" stroke="#28766a" stroke-width="3"/><path d="M884.00,423.44 L892.00,423.44" fill="none" stroke="#28766a" stroke-width="3"/><path d="M898.00,423.44 L906.00,423.44" fill="none" stroke="#28766a" stroke-width="3"/><path d="M912.00,423.44 L920.00,423.44" fill="none" stroke="#28766a" stroke-width="3"/><path d="M926.00,423.44 L930.00,423.44" fill="none" stroke="#28766a" stroke-width="3"/><path d="M918.3513175321682 429.21132539055174 L930 423.44 L918.3513175321682 417.66867460944826" fill="none" stroke="#28766a" stroke-width="3"/><text x="884" y="335.44" font-family="Malgun Gothic,sans-serif" font-size="20" font-weight="400" fill="#28766a" text-anchor="start">«extend»</text><text x="650" y="540.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">확장점: 금액 확정 전 / 조건: 유효 쿠폰 있음</text><text x="44" y="674.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">점선의 열린 화살표는 관계의 방향입니다. extend는 조건 생략도 허용하므로 “가끔”만으로 판정하지</text><text x="44" y="708.5200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">않습니다.</text><text x="44" y="804.6" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">포함하는 쪽 → 포함되는 쪽 / 확장 동작 → 기본 동작</text></svg>