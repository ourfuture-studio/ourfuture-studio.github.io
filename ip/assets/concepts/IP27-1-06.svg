<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img"><title>자료흐름도(DFD, Data Flow Diagram)의 전달 방향</title><desc>신청 데이터가 접수 처리에서 검증 처리로 이동한다. 데이터 종류와 방향은 확인되지만 실행 시각과 동시성은 별도 명세가 필요하다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-1-06 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">자료흐름도(DFD, Data Flow Diagram)의 전달 방향</text><rect x="44" y="190.44" width="390" height="170" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="62" y="226.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">접수 처리(Receiving Process)</text><text x="62" y="272.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">데이터를 보냄</text><rect x="766" y="190.44" width="390" height="170" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="784" y="226.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">검증 처리(Validation Process</text><text x="784" y="263.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">)</text><text x="784" y="309.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">데이터를 받음</text><path d="M434.0,275.4 L766.0,275.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M754.3513175321682 281.21132539055174 L766 275.44 L754.3513175321682 269.66867460944826 Z" fill="#315f97"/><text x="600" y="210.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="middle">신청 데이터(Application</text><text x="600" y="244.04" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="middle">Data)</text><rect x="44" y="429.44" width="1112" height="114" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="62" y="465.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">화살표로 확인</text><text x="62" y="511.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">데이터 종류와 전달 방향</text><rect x="44" y="567.44" width="1112" height="114" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="62" y="603.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">별도 명세가 필요</text><text x="62" y="649.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">실행 시각·동시성·전체 선후</text><text x="44" y="725.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">자료흐름도(DFD, Data Flow Diagram)의 화살표만으로 시간 순서나 스케줄을 확정하지 않습니다.</text><text x="44" y="821.5200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">전달 방향과 시간 순서를 같은 정보로 취급하지 않습니다.</text></svg>