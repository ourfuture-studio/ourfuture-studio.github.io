<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="912" viewBox="0 0 1200 912" role="img"><title>방화벽(Firewall)·침입 탐지 시스템(IDS, Intrusion Detection System)·침입 방지 시스템(IPS, Intrusion Prevention System)</title><desc>목적 포트443을 허용하고 패턴이 일치한 가상 패킷을 두 설정으로 비교한다. 경보만 기록하고 후속대응이 없으면 전달되며 인라인 차단이 켜진 설정에서는 해당 패킷을 버린다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-4-16 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">방화벽(Firewall)·침입 탐지 시스템(IDS, Intrusion Detection System)·침입</text><text x="44" y="127.44" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">방지 시스템(IPS, Intrusion Prevention System)</text><rect x="44" y="190.88" width="1112" height="114" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="62" y="226.88" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">같은 가상 패킷(Packet)</text><text x="62" y="272.88" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">목적 포트443 · 고정 센서 패턴 일치 · 방화벽(Firewall) 정책은443 허용</text><rect x="44" y="334.88" width="546" height="150" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="62" y="370.88" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">경보만 기록(Alert-only)</text><text x="62" y="416.88" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">IDS 탐지 경보</text><path d="M317.0,494.9 L317.0,549.9" fill="none" stroke="#28766a" stroke-width="3"/><path d="M311.22867460944826 538.2313175321682 L317 549.88 L322.77132539055174 538.2313175321682 Z" fill="#28766a"/><rect x="44" y="569.88" width="546" height="105" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="62" y="605.88" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">직접 차단·후속 자동 대응 없음 → 패킷</text><text x="62" y="642.88" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">전달</text><rect x="610" y="334.88" width="546" height="150" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="628" y="370.88" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">인라인 차단(Inline Blocking)</text><text x="628" y="416.88" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">IPS 탐지 + 차단</text><path d="M883.0,494.9 L883.0,549.9" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M877.2286746094483 538.2313175321682 L883 549.88 L888.7713253905517 538.2313175321682 Z" fill="#a45d30"/><rect x="610" y="569.88" width="546" height="105" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="628" y="605.88" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">해당 패킷을 버리는 조치가 켜짐 → 전달</text><text x="628" y="642.88" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">중단</text><text x="44" y="718.88" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">두 가지 설정을 비교한 교육 모형입니다. IDS/IPS라는 제품 이름만으로 실제 차단 여부나 모든 공격의</text><text x="44" y="752.96" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">방어를 확정하지 않습니다.</text><text x="44" y="849.04" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">경보를 기록했다는 사실과 실제로 차단했다는 사실을 따로 확인합니다.</text></svg>