hor="middle">Q</text><text x="160" y="422.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">0</text><text x="270" y="422.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">1</text><text x="380" y="422.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">2</text><text x="490" y="422.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">3</text><text x="600" y="422.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">4</text><text x="710" y="422.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">5</text><text x="820" y="422.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">6</text><text x="930" y="422.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">7</text><text x="1040" y="422.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">8</text><path d="M160,126 L160,156" fill="none" stroke="#617b82" stroke-width="2" /><path d="M160.00,156.00 L153.04,141.59 L166.96,141.59 Z" fill="#617b82" /><text x="164" y="120.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">P 도착</text><path d="M270,126 L270,156" fill="none" stroke="#617b82" stroke-width="2" /><path d="M270.00,156.00 L263.04,141.59 L276.96,141.59 Z" fill="#617b82" /><text x="274" y="120.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-