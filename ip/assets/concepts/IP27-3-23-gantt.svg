<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>비선점 FCFS와 SJF의 간트 차트</title><desc>P(도착0,실행4), Q(1,3), R(2,1). FCFS는 P 0~4, Q 4~7, R 7~8이고 SJF는 P 0~4, R 4~5, Q 5~8이다. Q의 반환시간은 6과 7, 대기시간은 3과 4다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-3-23 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">비선점 FCFS와 SJF의 간트 차트</text><text x="60" y="202.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">FCFS</text><rect x="160" y="160" width="440" height="64" rx="0" fill="#edf4fb" stroke="#315f97" stroke-width="2" /><text x="380.0" y="201.1" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="26" font-weight="700" fill="#203d43" text-anchor="middle">P</text><rect x="600" y="160" width="330" height="64" rx="0" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="765.0" y="201.1" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="26" font-weight="700" fill="#203d43" text-anchor="middle">Q</text><rect x="930" y="160" width="110" height="64" rx="0" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="985.0" y="201.1" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="26" font-weight="700" fill="#203d43" text-anchor="middle">R</text><text x="160" y="252.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">0</text><text x="270" y="252.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">1</text><text x="380" y="252.0" font-family="Malgun Gothic,Apple S