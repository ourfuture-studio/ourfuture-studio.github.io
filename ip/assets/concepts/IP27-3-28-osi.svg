<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>OSI 7계층: 기능·데이터 단위·주소</title><desc>OSI 7계층의 기능에 인터넷 프로토콜 예시를 대응한다. 전송계층은 종단 간 전달과 포트 다중화이며 TCP 세그먼트와 UDP 데이터그램을 구분한다. 제품 하나가 여러 계층 기능을 수행할 수 있다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-3-28 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">OSI 7계층: 기능·데이터 단위·주소</text><rect x="44" y="130" width="170" height="72" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="129.0" y="173.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">계층</text><rect x="214" y="130" width="280" height="72" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="354.0" y="173.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">하는 일</text><rect x="494" y="130" width="170" height="72" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="579.0" y="173.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">데이터 단위</text><rect x="664" y="130" width="250" height="72" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="789.0" y="173.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">주소·프로토콜</text><rect x="914" y="130" width="242" height="72" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="1035.0" y="173.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">대표 장비</text><rect x="44" y="202" width="170" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="129.0" y="245.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">7 응용</text><rect x="214" y="202" width="280" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="354.0" y="245.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">사용자 서비스</text><rect x="494" y="202" width="170" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="579.0" y="245.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">데이터</text><rect x="664" y="202" width="250" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="789.0" y="245.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">HTTP, DNS, SMTP</text><rect x="914" y="202" width="242" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="1035.0" y="245.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">—</text><rect x="44" y="274" width="170" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="129.0" y="317.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">6 표현</text><rect x="214" y="274" width="280" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="354.0" y="317.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">형식 변환·암호화·압축</text><rect x="494" y="274" width="170" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="579.0" y="317.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">데이터</text><rect x="664" y="274" width="250" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="789.0" y="317.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">JPEG, ASCII</text><rect x="914" y="274" width="242" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="1035.0" y="317.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">—</text><rect x="44" y="346" width="170" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="129.0" y="389.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">5 세션</text><rect x="214" y="346" width="280" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="354.0" y="389.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">대화 연결·동기</text><rect x="494" y="346" width="170" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="579.0" y="389.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">데이터</text><rect x="664" y="346" width="250" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="789.0" y="389.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">세션 관리</text><rect x="914" y="346" width="242" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="1035.0" y="389.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">—</text><rect x="44" y="418" width="170" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="129.0" y="461.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">4 전송</text><rect x="214" y="418" width="280" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="354.0" y="461.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">종단 간 전달·다중화</text><rect x="494" y="418" width="170" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="579.0" y="449" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">TCP: Segment</text><text x="579.0" y="477" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">UDP: Datagram</text><rect x="664" y="418" width="250" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="789.0" y="461.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">포트, TCP/UDP</text><rect x="914" y="418" width="242" height="72" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="1035.0" y="461.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">—</text><rect x="44" y="490" width="170" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="129.0" y="533.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">3 네트워크</text><rect x="214" y="490" width="280" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="354.0" y="533.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">경로 선택(라우팅)</text><rect x="494" y="490" width="170" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="579.0" y="533.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">패킷</text><rect x="664" y="490" width="250" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="789.0" y="533.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">IP 주소</text><rect x="914" y="490" width="242" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="1035.0" y="533.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">라우터</text><rect x="44" y="562" width="170" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="129.0" y="605.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">2 데이터링크</text><rect x="214" y="562" width="280" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="354.0" y="605.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">인접 노드 프레임 전달</text><rect x="494" y="562" width="170" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="579.0" y="605.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">프레임</text><rect x="664" y="562" width="250" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="789.0" y="605.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">MAC 주소</text><rect x="914" y="562" width="242" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="1035.0" y="605.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">스위치·브리지</text><rect x="44" y="634" width="170" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="129.0" y="677.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">1 물리</text><rect x="214" y="634" width="280" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="354.0" y="677.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">비트를 신호로</text><rect x="494" y="634" width="170" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="579.0" y="677.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">비트</text><rect x="664" y="634" width="250" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="789.0" y="677.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">케이블·신호</text><rect x="914" y="634" width="242" height="72" rx="0" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="1035.0" y="677.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">허브·리피터</text><text x="44" y="730.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">TCP: 세그먼트 / UDP: 데이터그램 · 장비 이름만으로 계층을 단정하지 않는다.</text></svg>