<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>if (A AND B) S; 커버리지 분모와 관찰 항목</title><desc>테스트 (T,T) 하나는 문장 1/1, 결정 참 1/2, 조건 A참·B참 2/4를 확인한다. (F,T)를 더하면 결정 2/2, 조건 3/4, (T,F)를 더하면 조건 4/4가 된다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-1-27 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">if (A AND B) S; 커버리지 분모와 관찰 항목</text><rect x="60" y="140" width="240" height="84" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="180.0" y="189.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">테스트 집합</text><rect x="300" y="140" width="260" height="84" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="430.0" y="189.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">문장 (분모 1)</text><rect x="560" y="140" width="300" height="84" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="710.0" y="189.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">결정 (분모 2)</text><rect x="860" y="140" width="280" height="84" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="1000.0" y="189.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">조건 (분모 4)</text><rect x="60" y="224" width="240" height="84" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="180.0" y="273.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">{(T,T)}</text><rect x="300" y="224" width="260" height="84" rx="0" fill="#edf7f2" stroke="#c9d6da" stroke-width="1" /><text x="430.0" y="273.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#203d43" text-anchor="middle">S → 100%</text><rect x="560" y="224" width="300" height="84" rx="0" fill="#fbf1e8" stroke="#c9d6da" stroke-width="1" /><text x="710.0" y="273.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#203d43" text-anchor="middle">참 → 50%</text><rect x="860" y="224" width="280" height="84" rx="0" fill="#fbf1e8" stroke="#c9d6da" stroke-width="1" /><text x="1000.0" y="273.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#203d43" text-anchor="middle">A참·B참 → 50%</text><rect x="60" y="308" width="240" height="84" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="180.0" y="357.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">+ (F,T)</text><rect x="300" y="308" width="260" height="84" rx="0" fill="#edf7f2" stroke="#c9d6da" stroke-width="1" /><text x="430.0" y="357.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#203d43" text-anchor="middle">100%</text><rect x="560" y="308" width="300" height="84" rx="0" fill="#edf7f2" stroke="#c9d6da" stroke-width="1" /><text x="710.0" y="357.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#203d43" text-anchor="middle">참·거짓 → 100%</text><rect x="860" y="308" width="280" height="84" rx="0" fill="#fbf1e8" stroke="#c9d6da" stroke-width="1" /><text x="1000.0" y="357.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#203d43" text-anchor="middle">+A거짓 → 75%</text><rect x="60" y="392" width="240" height="84" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="180.0" y="441.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">+ (T,F)</text><rect x="300" y="392" width="260" height="84" rx="0" fill="#edf7f2" stroke="#c9d6da" stroke-width="1" /><text x="430.0" y="441.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#203d43" text-anchor="middle">100%</text><rect x="560" y="392" width="300" height="84" rx="0" fill="#edf7f2" stroke="#c9d6da" stroke-width="1" /><text x="710.0" y="441.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#203d43" text-anchor="middle">100%</text><rect x="860" y="392" width="280" height="84" rx="0" fill="#edf7f2" stroke="#c9d6da" stroke-width="1" /><text x="1000.0" y="441.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#203d43" text-anchor="middle">+B거짓 → 100%</text><text x="60" y="520.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#617b82" text-anchor="start">조건 결과 네 칸</text><rect x="60" y="545" width="250" height="90" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="185.0" y="584.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">A참</text><text x="185.0" y="610.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">처음 확인: (T,T)</text><rect x="335" y="545" width="250" height="90" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="460.0" y="584.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">A거짓</text><text x="460.0" y="610.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">처음 확인: (F,T)</text><rect x="610" y="545" width="250" height="90" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="735.0" y="584.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">B참</text><text x="735.0" y="610.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">처음 확인: (T,T)</text><rect x="885" y="545" width="250" height="90" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="1010.0" y="584.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">B거짓</text><text x="1010.0" y="610.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">처음 확인: (T,F)</text><text x="60" y="675" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#203d43">두 원자 조건을 항상 모두 평가하며 단락 평가는 없는 논리 모형입니다.</text></svg>