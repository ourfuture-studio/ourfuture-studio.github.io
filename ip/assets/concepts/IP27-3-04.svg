<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1116" viewBox="0 0 1200 1116" role="img"><title>실제 배열(Array)과 포인터 매개변수(Pointer Parameter)</title><desc>호출자의 int a[3]는 세 int 원소 전체이고 함수의 int a[] 매개변수는 int *a로 조정된다. 호출자에서는 sizeof a/sizeof a[0]이3이지만 함수에서는 sizeof a가 sizeof(int*)와 같다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-3-04 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">실제 배열(Array)과 포인터 매개변수(Pointer Parameter)</text><text x="44" y="170.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#203d43" text-anchor="start">호출자의 실제 배열(Array Object)</text><rect x="44" y="195.44" width="1112" height="145" rx="12" fill="#fff" stroke="#315f97" stroke-width="2"/><rect x="44.0" y="195.44" width="370.6666666666667" height="145" rx="0" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="229.33333333333334" y="256.44" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#203d43" text-anchor="middle">a[0]</text><text x="229.33333333333334" y="303.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="middle">int 원소</text><rect x="414.6666666666667" y="195.44" width="370.6666666666667" height="145" rx="0" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="600.0" y="256.44" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#203d43" text-anchor="middle">a[1]</text><text x="600.0" y="303.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="middle">int 원소</text><rect x="785.3333333333334" y="195.44" width="370.6666666666667" height="145" rx="0" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="970.6666666666667" y="256.44" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#203d43" text-anchor="middle">a[2]</text><text x="970.6666666666667" y="303.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="middle">int 원소</text><rect x="44" y="405.44" width="1112" height="114" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="62" y="441.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">sizeof a = 3 × sizeof(int)</text><text x="62" y="487.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">이 위치에서는 sizeof a / sizeof a[0] = 3</text><rect x="44" y="595.44" width="1112" height="114" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="62" y="631.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">함수 매개변수 int a[] → int *a</text><text x="62" y="677.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">Parameter Adjustment: 배열 전체가 아니라 포인터 값을 받음</text><path d="M600.0,729.4 L600.0,774.4" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M594.2286746094483 762.7913175321683 L600.0 774.44 L605.7713253905517 762.7913175321683 Z" fill="#a45d30"/><rect x="44" y="799.44" width="1112" height="114" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="62" y="835.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">함수 안: sizeof a == sizeof(int *)</text><text x="62" y="881.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">포인터의 바이트 수를 4나 8로 고정하지 않아도 이 비교는 참입니다.</text><text x="44" y="957.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">같은 이름 a라도 실제 배열인지 조정된 포인터 매개변수인지 먼저 확인합니다.</text><text x="44" y="1053.52" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">sizeof 앞의 이름이 실제 배열인지 포인터 매개변수인지 확인합니다.</text></svg>