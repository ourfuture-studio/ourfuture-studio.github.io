<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>응집도(cohesion)와 결합도(coupling)의 등급</title><desc>응집도는 기능적에서 우연적으로 갈수록 약해지며 강할수록 좋다. 결합도는 자료에서 내용으로 갈수록 강해지며 약할수록 좋다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-1-09·1-10 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">응집도(cohesion)와 결합도(coupling)의 등급</text><text x="310" y="140.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="middle">응집도: 강할수록 좋다</text><text x="890" y="140.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="middle">결합도: 약할수록 좋다</text><rect x="60" y="165" width="500" height="64" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="80" y="195.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">1. 기능적</text><text x="80" y="219.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">functional</text><text x="545" y="205.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">한 기능에 모두 필요</text><rect x="60" y="239" width="500" height="64" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="80" y="269.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">2. 순차적</text><text x="80" y="293.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">sequential</text><text x="545" y="279.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">앞 출력 → 다음 입력</text><rect x="60" y="313" width="500" height="64" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="80" y="343.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">3. 교환적</text><text x="80" y="367.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">communicational</text><text x="545" y="353.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">같은 데이터 사용</text><rect x="60" y="387" width="500" height="64" rx="8" fill="#ffffff" stroke="#c9d6da" stroke-width="2" /><text x="80" y="417.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">4. 절차적</text><text x="80" y="441.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">procedural</text><text x="545" y="427.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">정해진 실행 순서</text><rect x="60" y="461" width="500" height="64" rx="8" fill="#ffffff" stroke="#c9d6da" stroke-width="2" /><text x="80" y="491.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">5. 시간적</text><text x="80" y="515.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">temporal</text><text x="545" y="501.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">같은 시점에 실행</text><rect x="60" y="535" width="500" height="64" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="80" y="565.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">6. 논리적</text><text x="80" y="589.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">logical</text><text x="545" y="575.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">비슷한 종류, 플래그 선택</text><rect x="60" y="609" width="500" height="64" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="80" y="639.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">7. 우연적</text><text x="80" y="663.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">coincidental</text><text x="545" y="649.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">관련 없음</text><rect x="640" y="165" width="500" height="64" rx="8" fill="#edf4fb" stroke="#315f97" stroke-width="2" /><text x="660" y="195.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">1. 자료</text><text x="660" y="219.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">data</text><text x="1125" y="205.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">필요한 값만 전달</text><rect x="640" y="239" width="500" height="64" rx="8" fill="#edf4fb" stroke="#315f97" stroke-width="2" /><text x="660" y="269.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">2. 스탬프</text><text x="660" y="293.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">stamp</text><text x="1125" y="279.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">구조체 통째 전달</text><rect x="640" y="313" width="500" height="64" rx="8" fill="#ffffff" stroke="#c9d6da" stroke-width="2" /><text x="660" y="343.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">3. 제어</text><text x="660" y="367.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">control</text><text x="1125" y="353.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">흐름 바꾸는 플래그</text><rect x="640" y="387" width="500" height="64" rx="8" fill="#ffffff" stroke="#c9d6da" stroke-width="2" /><text x="660" y="417.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">4. 외부</text><text x="660" y="441.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">external</text><text x="1125" y="427.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">외부 형식·장치 공유</text><rect x="640" y="461" width="500" height="64" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="660" y="491.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">5. 공통</text><text x="660" y="515.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">common</text><text x="1125" y="501.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">전역 변수 공유</text><rect x="640" y="535" width="500" height="64" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="660" y="565.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">6. 내용</text><text x="660" y="589.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">content</text><text x="1125" y="575.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="end">남의 내부에 직접 접근</text><path d="M30,170 L30,670" fill="none" stroke="#28766a" stroke-width="4" /><path d="M30.00,670.00 L23.04,655.59 L36.96,655.59 Z" fill="#28766a" /><text x="30" y="700.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#a45d30" text-anchor="middle">약</text><text x="30" y="160.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#28766a" text-anchor="middle">강</text><path d="M1170,170 L1170,600" fill="none" stroke="#315f97" stroke-width="4" /><path d="M1170.00,600.00 L1163.04,585.59 L1176.96,585.59 Z" fill="#315f97" /><text x="1170" y="160.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#315f97" text-anchor="middle">약</text><text x="1170" y="630.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#a45d30" text-anchor="middle">강</text><rect x="44" y="726" width="1112" height="56" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="1" /><text x="600.0" y="762.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">좋은 설계 = 응집도는 높게, 결합도는 낮게 · 외우기: 기순교절시논우 / 자스제외공내</text></svg>