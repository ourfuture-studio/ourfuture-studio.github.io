<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>192.0.2.75/27: 앞 27비트는 네트워크, 뒤 5비트는 호스트</title><desc>마지막 옥텟 75는 01001011이다. /27이면 앞 3비트 010이 네트워크, 뒤 5비트가 호스트다. 호스트 비트를 0으로 하면 64, 1로 하면 95다. 사용 가능 호스트는 32−2=30개다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-3-29 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">192.0.2.75/27: 앞 27비트는 네트워크, 뒤 5비트는 호스트</text><text x="44" y="150.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#315f97" text-anchor="start">앞 세 옥텟 192.0.2 (24비트, 모두 네트워크)</text><rect x="44" y="170" width="1112" height="50" rx="4" fill="#edf4fb" stroke="#315f97" stroke-width="2" /><text x="600" y="204.0" font-family="Consolas,D2Coding,monospace" font-size="24" font-weight="700" fill="#315f97" text-anchor="middle">11000000 . 00000000 . 00000010</text><text x="44" y="280.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="start">마지막 옥텟 75</text><rect x="120" y="300" width="112" height="80" rx="8" fill="#edf4fb" stroke="#315f97" stroke-width="2" /><text x="176.0" y="351.9" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#203d43" text-anchor="middle">0</text><text x="176.0" y="410.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">128</text><rect x="240" y="300" width="112" height="80" rx="8" fill="#edf4fb" stroke="#315f97" stroke-width="2" /><text x="296.0" y="351.9" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#203d43" text-anchor="middle">1</text><text x="296.0" y="410.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">64</text><rect x="360" y="300" width="112" height="80" rx="8" fill="#edf4fb" stroke="#315f97" stroke-width="2" /><text x="416.0" y="351.9" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#203d43" text-anchor="middle">0</text><text x="416.0" y="410.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">32</text><rect x="480" y="300" width="112" height="80" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="536.0" y="351.9" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#203d43" text-anchor="middle">0</text><text x="536.0" y="410.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">16</text><rect x="600" y="300" width="112" height="80" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="656.0" y="351.9" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#203d43" text-anchor="middle">1</text><text x="656.0" y="410.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">8</text><rect x="720" y="300" width="112" height="80" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="776.0" y="351.9" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#203d43" text-anchor="middle">0</text><text x="776.0" y="410.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">4</text><rect x="840" y="300" width="112" height="80" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width=