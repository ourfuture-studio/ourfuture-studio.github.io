f97" stroke-width="1" /><text x="950.0" y="526.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">주소</text><rect x="120" y="548" width="220" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="230.0" y="584.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#203d43" text-anchor="middle">네트워크 주소</text><rect x="340" y="548" width="200" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="440.0" y="584.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">00000</text><rect x="540" y="548" width="280" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="680.0" y="584.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">010 00000 = 64</text><rect x="820" y="548" width="260" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="950.0" y="584.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">192.0.2.64</text><rect x="120" y="606" width="220" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="230.0" y="642.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#203d43" text-anchor="middle">브로드캐스트</text><rect x="340" y="606" width="200" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="440.0" y="642.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">11111</text><rect x="540" y="606" width="280" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="680.0" y="642.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">010 11111 = 95</text><rect x="820" y="606" width="260" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="950.0" y="642.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">192.0.2.95</text><rect x="120" y="664" width="220" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="230.0" y="700.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#203d43" text-anchor="middle">사용 가능 호스트</text><rect x="340" y="664" width="200" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="440.0" y="700.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">그 사이</text><rect x="540" y="664" width="280" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="680.0" y="700.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">65 ~ 94</text><rect x="820" y="664" width="260" height="58" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="950.0" y="700.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">32 − 2 = 30개</text></svg>