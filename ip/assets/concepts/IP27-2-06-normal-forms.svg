<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img"><title>정규형(Normal Forms)과 종속 조건</title><desc>1NF는 원자 도메인, 2NF는 비주요 속성의 후보키 부분 종속 배제, 3NF는 비주요 속성의 후보키 이행 종속 배제다. BCNF와 4NF의 비자명 종속 결정자는 슈퍼키여야 하고 5NF의 비자명 조인 종속은 후보키로부터 유도되어야 한다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-2-06·2-07 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">정규형(Normal Forms)과 종속 조건</text><rect x="60" y="140" width="150" height="86" rx="8" fill="#315f97" stroke="#315f97" stroke-width="2" /><text x="135.0" y="193.5" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">1NF</text><rect x="230" y="140" width="910" height="86" rx="8" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="250" y="176.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="start">모든 값이 원자값</text><text x="250" y="208.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">위반 예: R(학생, {과목1,과목2})</text><text x="1120" y="176.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#a45d30" text-anchor="end">도메인 원자값</text><rect x="100" y="252" width="150" height="86" rx="8" fill="#315f97" stroke="#315f97" stroke-width="2" /><text x="175.0" y="305.5" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">2NF</text><rect x="270" y="252" width="870" height="86" rx="8" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="290" y="288.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="start">비주요 속성의 부분 종속 배제</text><text x="290" y="320.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">예: SC→G, S→N  → S→N 분리</text><text x="1120" y="288.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#a45d30" text-anchor="end">부분</text><rect x="140" y="364" width="150" height="86" rx="8" fill="#315f97" stroke="#315f97" stroke-width="2" /><text x="215.0" y="417.5" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">3NF</text><rect x="310" y="364" width="830" height="86" rx="8" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="330" y="400.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="start">비주요 속성의 이행 종속 배제</text><text x="330" y="432.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">예: E→D, D→N  → D→N 분리</text><text x="1120" y="400.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#a45d30" text-anchor="end">이행</text><rect x="180" y="476" width="150" height="86" rx="8" fill="#315f97" stroke="#315f97" stroke-width="2" /><text x="255.0" y="529.5" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">BCNF</text><rect x="350" y="476" width="790" height="86" rx="8" fill="#edf4fb" stroke="#c9d6da" stroke-width="1" /><text x="370" y="512.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="start">비자명 함수 종속: 결정자가 슈퍼키</text><text x="370" y="544.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">예: AB→C, C→B  → C→B 분리</text><text x="1120" y="512.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#a45d30" text-anchor="end">결정자</text><rect x="220" y="588" width="150" height="86" rx="8" fill="#f1f4f5" stroke="#315f97" stroke-width="2" /><text x="295.0" y="641.5" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#203d43" text-anchor="middle">4NF</text><rect x="390" y="588" width="750" height="86" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="1" /><text x="410" y="624.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="start">비자명 다치 종속: 결정자가 슈퍼키</text><text x="410" y="656.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">예: 강의→→교재, 강의→→강사</text><text x="1120" y="624.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#a45d30" text-anchor="end">다치</text><rect x="260" y="700" width="150" height="86" rx="8" fill="#f1f4f5" stroke="#315f97" stroke-width="2" /><text x="335.0" y="753.5" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#203d43" text-anchor="middle">5NF</text><rect x="430" y="700" width="710" height="86" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="1" /><text x="450" y="736.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="start">비자명 조인 종속은 후보키로 유도</text><text x="450" y="768.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">예: 세 분해를 조인해야 원본 복원</text><text x="1120" y="736.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#a45d30" text-anchor="end">조인</text><rect x="44" y="820" width="1112" height="56" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="1" /><text x="600.0" y="856.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">각 단계는 앞 정규형도 만족한다. 비자명 종속과 키 조건을 빠뜨리지 않는다.</text></svg>