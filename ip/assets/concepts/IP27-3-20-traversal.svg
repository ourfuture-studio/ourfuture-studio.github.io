<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>이진 트리 순회: 현재 노드를 언제 적는가</title><desc>루트 A의 왼쪽 B, 오른쪽 C, B의 오른쪽 D. 전위 A B D C, 중위 B D A C, 후위 D B C A.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-3-20 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">이진 트리 순회: 현재 노드를 언제 적는가</text><path d="M330,190 L200,330" fill="none" stroke="#203d43" stroke-width="3" /><path d="M330,190 L460,330" fill="none" stroke="#203d43" stroke-width="3" /><path d="M200,330 L290,470" fill="none" stroke="#203d43" stroke-width="3" /><circle cx="330" cy="190" r="40" fill="#edf4fb" stroke="#315f97" stroke-width="3" /><text x="330" y="200.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#315f97" text-anchor="middle">A</text><circle cx="200" cy="330" r="40" fill="#edf4fb" stroke="#315f97" stroke-width="3" /><text x="200" y="340.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#315f97" text-anchor="middle">B</text><circle cx="460" cy="330" r="40" fill="#edf4fb" stroke="#315f97" stroke-width="3" /><text x="460" y="340.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#315f97" text-anchor="middle">C</text><circle cx="290" cy="470" r="40" fill="#edf4fb" stroke="#315f97" stroke-width="3" /><text x="290" y="480.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#315f97" text-anchor="middle">D</text><text x="130" y="470.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">B.left = 없음</text><rect x="600" y="160" width="200" height="80" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="700.0" y="207.3" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">순회</text><rect x="800" y="160" width="180" height="80" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="890.0" y="207.3" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">규칙</text><rect x="980" y="160" width="160" height="80" rx="0" fill="#315f97" stroke="#315f97" stroke-width="1" /><text x="1060.0" y="207.3" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">결과</text><rect x="600" y="240" width="200" height="80" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="700.0" y="287.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#203d43" text-anchor="middle">전위 preorder</text><rect x="800" y="240" width="180" height="80" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="890.0" y="287.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">현재 → 왼 → 오</text><rect x="980" y="240" width="160" height="80" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="1060.0" y="287.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">A B D C</text><rect x="600" y="320" width="200" height="80" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="700.0" y="367.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#203d43" text-anchor="middle">중위 inorder</text><rect x="800" y="320" width="180" height="80" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="890.0" y="367.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">왼 → 현재 → 오</text><rect x="980" y="320" width="160" height="80" rx="0" fill="#edf7f2" stroke="#c9d6da" stroke-width="1" /><text x="1060.0" y="367.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">B D A C</text><rect x="600" y="400" width="200" height="80" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="700.0" y="447.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#203d43" text-anchor="middle">후위 postorder</text><rect x="800" y="400" width="180" height="80" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="890.0" y="447.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">왼 → 오 → 현재</text><rect x="980" y="400" width="160" height="80" rx="0" fill="#ffffff" stroke="#c9d6da" stroke-width="1" /><text x="1060.0" y="447.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="400" fill="#203d43" text-anchor="middle">D B C A</text><rect x="44" y="600" width="1112" height="56" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="1" /><text x="600.0" y="636.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">이름의 '전·중·후'는 현재 노드를 적는 위치다. 중위 결과가 정렬되는 것은 이진 탐색 트리일 때뿐이다.</text></svg>