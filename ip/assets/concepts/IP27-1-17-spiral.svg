<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img"><title>나선형 모형(Spiral Model)의 위험 기반 반복</title><desc>목표·대안·제약을 정하고 위험 분석, 개발·검증, 이해관계자 평가와 다음 반복 계획을 수행한다. 활동의 선택과 노력은 위험에 따라 달라지며 모든 활동을 고정 순서로 강제하지 않는다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-1-17 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">나선형 모형(Spiral Model)의 위험 기반 반복</text><path d="M180,470 L1020,470" fill="none" stroke="#c9d6da" stroke-width="2" /><path d="M600,130 L600,810" fill="none" stroke="#c9d6da" stroke-width="2" /><text x="340" y="150.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#315f97" text-anchor="middle">① 목표·대안·제약</text><text x="340" y="178.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">objectives / alternatives / constraints</text><text x="860" y="150.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#a45d30" text-anchor="middle">② 위험 분석</text><text x="860" y="178.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">risk analysis</text><text x="860" y="770.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#28766a" text-anchor="middle">③ 개발·검증</text><text x="860" y="798.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">engineering</text><text x="340" y="770.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#315f97" te