<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="871" viewBox="0 0 1200 871" role="img"><title>원자성(Atomicity)과 격리성(Isolation)의 질문</title><desc>A60·B40에서 A만15출금해 A45·B40이 된 뒤 ROLLBACK하면 A60·B40으로 돌아간다. 다른 거래의 관찰은 격리 수준에 따른 별도 문제다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-2-20 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">원자성(Atomicity)과 격리성(Isolation)의 질문</text><rect x="44" y="145.44" width="1112" height="114" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="62" y="181.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">원자성(Atomicity): 한 트랜잭션의 반영·취소</text><text x="62" y="227.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">단일 연결에서 출금 후 실패를 감지하고 ROLLBACK</text><rect x="44" y="283.44" width="326" height="170" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="62" y="319.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">처음(Before)</text><text x="62" y="365.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">A 60 / B 40</text><rect x="425" y="283.44" width="326" height="170" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="443" y="319.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">출금 후(Inside)</text><text x="443" y="365.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">A 45 / B 40</text><rect x="806" y="283.44" width="326" height="170" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="824" y="319.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">취소 후(Rollback)</text><text x="824" y="365.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">A 60 / B 40</text><path d="M376.0,368.4 L419.0,368.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M407.3513175321682 374.21132539055174 L419 368.44 L407.3513175321682 362.66867460944826 Z" fill="#315f97"/><path d="M757.0,368.4 L800.0,368.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M788.3513175321682 374.21132539055174 L800 368.44 L788.3513175321682 362.66867460944826 Z" fill="#315f97"/><rect x="44" y="485.44" width="1112" height="149" rx="12" fill="#f4eff9" stroke="#765490" stroke-width="2"/><text x="62" y="521.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#765490" text-anchor="start">격리성(Isolation): 다른 트랜잭션의 관찰</text><text x="62" y="567.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">T1이 갱신하는 동안 T2는 무엇을 볼까요? DBMS와 격리 수준(Isolation Level)을 따로 확인해야</text><text x="62" y="602.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">합니다.</text><text x="44" y="678.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">출금만 작성해 정상 COMMIT하면 DBMS가 빠진 입금을 스스로 만들지는 않습니다. 이 수치 예제는</text><text x="44" y="712.5200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">동시성 실험이 아닙니다.</text><text x="44" y="808.6" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">작업 전체의 반영·취소와 동시 거래의 관찰 규칙을 구분합니다.</text></svg>