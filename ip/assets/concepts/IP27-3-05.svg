<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img"><title>포인터 연산(Pointer Arithmetic)의 원소 단위</title><desc>배열a의 값4·9·15에서 p=a+1은 가운데 원소9를 가리킨다. p−a는1이며 배열 끝 바로뒤 a+3은 만들 수 있으나 역참조할 수 없다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-3-05 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">포인터 연산(Pointer Arithmetic)의 원소 단위</text><rect x="44.0" y="230.44" width="370.6666666666667" height="140" rx="0" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="229.33333333333334" y="273.44" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#203d43" text-anchor="middle">a[0]</text><text x="229.33333333333334" y="329.44" font-family="Malgun Gothic,sans-serif" font-size="35" font-weight="700" fill="#203d43" text-anchor="middle">4</text><rect x="414.6666666666667" y="230.44" width="370.6666666666667" height="140" rx="0" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="600.0" y="273.44" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#203d43" text-anchor="middle">a[1]</text><text x="600.0" y="329.44" font-family="Malgun Gothic,sans-serif" font-size="35" font-weight="700" fill="#203d43" text-anchor="middle">9</text><rect x="785.3333333333334" y="230.44" width="370.6666666666667" height="140" rx="0" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="970.6666666666667" y="273.44" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#203d43" text-anchor="middle">a[2]</text><text x="970.6666666666667" y="329.44" font-family="Malgun Gothic,sans-serif" font-size="35" font-weight="700" fill="#203d43" text-anchor="middle">15</text><text x="600.0" y="175.44" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#28766a" text-anchor="middle">p = a + 1</text><path d="M600.0,188.4 L600.0,227.4" fill="none" stroke="#28766a" stroke-width="3"/><path d="M594.2286746094483 215.79131753216816 L600.0 227.44 L605.7713253905517 215.79131753216816 Z" fill="#28766a"/><path d="M1156.00,215.44 L1156.00,223.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,229.44 L1156.00,237.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,243.44 L1156.00,251.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,257.44 L1156.00,265.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,271.44 L1156.00,279.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,285.44 L1156.00,293.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,299.44 L1156.00,307.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,313.44 L1156.00,321.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,327.44 L1156.00,335.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,341.44 L1156.00,349.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,355.44 L1156.00,363.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,369.44 L1156.00,377.44" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M1156.00,383.44 L1156.00,385.44" fill="none" stroke="#a45d30" stroke-width="3"/><rect x="44" y="420.44" width="1112" height="114" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="62" y="456.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">포인터 차이(Pointer Difference)</text><text x="62" y="502.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">p − a = 1개 원소 / *p = 9</text><rect x="44" y="559.44" width="1112" height="114" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="62" y="595.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">배열 끝 바로 뒤(One-past Pointer)</text><text x="62" y="641.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">a + 3은 만들 수 있지만 *(a + 3)으로 역참조하면 안 됩니다.</text><text x="44" y="717.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">p+1의 이동 단위는 가리키는 자료형의 원소입니다. 바이트 주소 차이에는 sizeof(int)가 필요하며 int를</text><text x="44" y="751.5200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">항상 4바이트로 가정하지 않습니다.</text><text x="44" y="847.6" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">한 칸 이동은 한 원소 이동입니다. 바이트 차이를 말할 때 sizeof(T)를 확인합니다.</text></svg>