<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>C 인자 전달: 값이 복사되고, 복사된 주소로 원본을 고친다</title><desc>by_value(x)는 x의 값 5를 v에 복사하므로 v=11이 x를 바꾸지 않는다. by_pointer(&amp;x)는 x의 주소를 p에 복사하므로 *p=11이 x를 11로 바꾼다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-3-06 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">C 인자 전달: 값이 복사되고, 복사된 주소로 원본을 고친다</text><text x="300" y="140.0" font-family="Consolas,D2Coding,monospace" font-size="26" font-weight="700" fill="#315f97" text-anchor="middle">by_value(x)</text><text x="900" y="140.0" font-family="Consolas,D2Coding,monospace" font-size="26" font-weight="700" fill="#28766a" text-anchor="middle">by_pointer(&amp;x)</text><path d="M600,120 L600,620" fill="none" stroke="#c9d6da" stroke-width="2" /><text x="120" y="210.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">main</text><rect x="120" y="220" width="200" height="90" rx="8" fill="#ffffff" stroke="#203d43" stroke-width="2" /><text x="220.0" y="274.1" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="26" font-weight="700" fill="#203d43" text-anchor="middle">x = 5</text><text x="120" y="400.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">by_value</text><rect x="120" y="410" width="200" height="90" rx="8" fill="#edf4fb" stroke="#315f97" stroke-width="2" /><text x="220.0" y="463.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">v = 5 → 11</text><path d="M220,310 L220,405" fill="none" stroke="#315f97" stroke-width="3" /><path d="M220.00,405.00 L213.04,390.59 L226.96,390.59 Z" fill="#315f97" /><text x="330" y="365.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#315f97" text-anchor="start">값 5를 복사</text><text x="300" y="560.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">x는 그대로 5</text><text x="700" y="210.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">main</text><rect x="700" y="220" width="200" height="90" rx="8" fill="#ffffff" stroke="#203d43" stroke-width="2" /><text x="800.0" y="273.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">x = 5 → 11</text><text x="900" y="204.0" font-family="Consolas,D2Coding,monospace" font-size="20" font-weight="400" fill="#617b82" text-anchor="end">주소 기호 &amp;x</text><text x="700" y="400.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">by_pointer</text><rect x="700" y="410" width="200" height="90" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="800.0" y="463.4" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">p = &amp;x</text><path d="M800,310 L800,405" fill="none" stroke="#28766a" stroke-width="3" /><path d="M800.00,405.00 L793.04,390.59 L806.96,390.59 Z" fill="#28766a" /><text x="785" y="365.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#28766a" text-anchor="end">주소값을 복사</text><path d="M900,455 C1010,455 1010,265 905,265" fill="none" stroke="#28766a" stroke-width="3" /><path d="M905.00,265.00 L919.41,258.04 L919.41,271.96 Z" fill="#28766a" /><text x="1000" y="368.0" font-family="Consolas,D2Coding,monospace" font-size="24" font-weight="700" fill="#28766a" text-anchor="start">*p = 11</text><text x="900" y="560.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">*p로 x를 직접 수정</text><rect x="44" y="660" width="1112" height="56" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="1" /><text x="600.0" y="696.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">포인터도 '값(주소)'을 복사한다. p = &amp;local처럼 p 자체를 바꾸면 호출자 x는 바뀌지 않는다.</text></svg>