<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>DAS·NAS·SAN: 연결 경로와 받는 단위</title><desc>DAS는 서버에 직접 연결한 블록 장치, NAS는 네트워크로 NFS·SMB 파일 서비스를 받는 구성, SAN은 저장 네트워크로 블록 장치를 받아 호스트가 파일 시스템을 만드는 구성이다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-4-19 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">DAS·NAS·SAN: 연결 경로와 받는 단위</text><text x="230" y="145.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#315f97" text-anchor="middle">DAS</text><text x="230" y="172.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">Direct-Attached Storage</text><text x="600" y="145.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#28766a" text-anchor="middle">NAS</text><text x="600" y="172.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">Network-Attached Storage</text><text x="970" y="145.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#a45d30" text-anchor="middle">SAN</text><text x="970" y="172.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">Storage Area Network</text><rect x="90" y="210" width="280" height="90" rx="8" fill="#ffffff" stroke="#203d43" stroke-width="2" /><text x="230.0" y="249.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">서버</text><text x="230.0" y="275.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">(파일 시스템)</text><rect x="90" y="420" width="280" height="90" rx="8" fill="#edf4fb" stroke="#315f97" stroke-width="2" /><text x="230.0" y="472.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">디스크</text><path d="M230,300 L230,415" fill="none" stroke="#315f97" stroke-width="4" /><path d="M230.00,415.00 L223.04,400.59 L236.96,400.59 Z" fill="#315f97" /><text x="250" y="365.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#315f97" text-anchor="start">SAS 케이블 직결</text><rect x="460" y="210" width="280" height="70" rx="8" fill="#ffffff" stroke="#203d43" stroke-width="2" /><text x="600.0" y="252.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">클라이언트</text><rect x="460" y="330" width="280" height="60" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="2" /><text x="600.0" y="366.3" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">LAN (Ethernet)</text><rect x="460" y="440" width="280" height="90" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="600.0" y="479.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">NAS 장비</text><text x="600.0" y="505.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">(파일 시스템 내장)</text><path d="M600,280 L600,325" fill="none" stroke="#28766a" stroke-width="3" /><path d="M600.00,325.00 L593.04,310.59 L606.96,310.59 Z" fill="#28766a" /><path d="M600,390 L600,435" fill="none" stroke="#28766a" stroke-width="3" /><path d="M600.00,435.00 L593.04,420.59 L606.96,420.59 Z" fill="#28766a" /><text x="620" y="312.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#28766a" text-anchor="start">파일 요청(NFS/SMB)</text><rect x="830" y="210" width="280" height="90" rx="8" fill="#ffffff" stroke="#203d43" stroke-width="2" /><text x="970.0" y="249.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">서버</text><text x="970.0" y="275.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">(파일 시스템)</text><rect x="830" y="330" width="280" height="60" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="2" /><text x="970.0" y="366.3" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">SAN (FC 또는 iSCSI)</text><rect x="830" y="440" width="280" height="90" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="970.0" y="479.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">스토리지</text><text x="970.0" y="505.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">(LUN 블록)</text><path d="M970,300 L970,325" fill="none" stroke="#a45d30" stroke-width="3" /><path d="M970.00,325.00 L963.04,310.59 L976.96,310.59 Z" fill="#a45d30" /><path d="M970,390 L970,435" fill="none" stroke="#a45d30" stroke-width="3" /><path d="M970.00,435.00 L963.04,420.59 L976.96,420.59 Z" fill="#a45d30" /><text x="990" y="420.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#a45d30" text-anchor="start">블록 요청</text><rect x="44" y="590" width="1112" height="56" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="1" /><text x="600.0" y="626.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">구별 기준은 용량·속도가 아니라 '네트워크를 거치는가'와 '파일을 받는가, 블록을 받는가'다.</text></svg>