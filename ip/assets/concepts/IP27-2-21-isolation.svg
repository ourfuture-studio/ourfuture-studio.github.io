<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>PostgreSQL 18: 같은 행을 두 번 읽기</title><desc>PostgreSQL 18에서 T1은 같은 명시적 트랜잭션 안에서 일반 SELECT를 두 번 수행한다. 그 사이 T2가 20을 25로 바꾸고 커밋한다. Read Committed 재조회는 25, Repeatable Read 재조회는 20이다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-2-21 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">PostgreSQL 18: 같은 행을 두 번 읽기</text><text x="90" y="228.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="middle">T1</text><text x="90" y="338.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="middle">T2</text><path d="M130,220 L1140,220" fill="none" stroke="#315f97" stroke-width="3" /><path d="M1140.00,220.00 L1125.59,226.96 L1125.59,213.04 Z" fill="#315f97" /><path d="M130,330 L1140,330" fill="none" stroke="#a45d30" stroke-width="3" /><path d="M1140.00,330.00 L1125.59,336.96 L1125.59,323.04 Z" fill="#a45d30" /><circle cx="220" cy="220" r="10" fill="#315f97" stroke="#315f97" stroke-width="2" /><text x="220" y="170.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#315f97" text-anchor="middle">SELECT v</text><text x="220" y="196.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#315f97" text-anchor="middle">→ 20</text><circle cx="480" cy="330" r="10" fill="#a45d30" stroke="#a45d30" stroke-width="2" /><text x="480" y="374.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#a45d30" text-anchor="middle">UPDATE v=25</text><circle cx="700" cy="330" r="10" fill="#a45d30" stroke="#a45d30" stroke-width="2" /><text x="700" y="374.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#a45d30" text-anchor="middle">COMMIT</text><circle cx="960" cy="220" r="10" fill="#315f97" stroke="#315f97" stroke-width="2" /><text x="960" y="170.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#315f97" text-anchor="middle">SELECT v</text><text x="960" y="196.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#315f97" text-anchor="middle">→ ?</text><path d="M960.00,160.00 L960.00,166.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,172.00 L960.00,178.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,184.00 L960.00,190.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,196.00 L960.00,202.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,208.00 L960.00,214.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,220.00 L960.00,226.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,232.00 L960.00,238.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,244.00 L960.00,250.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,256.00 L960.00,262.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,268.00 L960.00,274.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,280.00 L960.00,286.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,292.00 L960.00,298.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,304.00 L960.00,310.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,316.00 L960.00,322.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,328.00 L960.00,334.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,340.00 L960.00,346.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,352.00 L960.00,358.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,364.00 L960.00,370.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,376.00 L960.00,382.00" fill="none" stroke="#617b82" stroke-width="2" /><path d="M960.00,388.00 L960.00,394.00" fill="none" stroke="#617b82" stroke-width="2" /><text x="960" y="430.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">두 번째 읽기 시점</text><rect x="130" y="470" width="470" height="150" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="365.0" y="524.1" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">READ COMMITTED</text><text x="365.0" y="552.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">문장마다 최신 커밋을 봄</text><text x="365.0" y="581.3" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">→ 25 (비반복 읽기)</text><rect x="630" y="470" width="510" height="150" rx="8" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="885.0" y="524.1" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">REPEATABLE READ</text><text x="885.0" y="552.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">첫 비제어 문장 스냅샷 유지</text><text x="885.0" y="581.3" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">→ 20</text><rect x="44" y="660" width="1112" height="56" rx="8" fill="#f1f4f5" stroke="#c9d6da" stroke-width="1" /><text x="600.0" y="696.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">T2가 커밋하기 전에 다시 읽으면 두 수준 모두 20이다(더티 읽기 없음).</text><text x="44" y="120" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#203d43">같은 명시적 T1 트랜잭션 · 일반 SELECT · 두 읽기 사이 T2 커밋</text></svg>