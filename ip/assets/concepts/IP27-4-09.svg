<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1072" viewBox="0 0 1200 1072" role="img"><title>암호화(Encryption)·해시(Cryptographic Hash)·전자서명(Digital Signature)</title><desc>암호화는 평문에서 암호문으로, 해시는 문서에서 요약값으로, 전자서명은 개인키로 서명하고 신뢰된 공개키로 문서와 서명을 검증하는 흐름이다. 공개 문서의 서명은 내용을 숨기지 않는다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-4-09 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">암호화(Encryption)·해시(Cryptographic Hash)·전자서명(Digital Signature)</text><rect x="44" y="145.44" width="350" height="582.3" rx="12" fill="#fff" stroke="#315f97" stroke-width="2"/><text x="64" y="185.44" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#315f97" text-anchor="start">암호화(Encryption)</text><rect x="64" y="248.78" width="310" height="100" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="82" y="284.78" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">평문(Plaintext)</text><text x="219.0" y="383.78" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="400" fill="#315f97" text-anchor="middle">키로 암호화</text><path d="M219.0,419.6 L219.0,469.6" fill="none" stroke="#315f97" stroke-width="3"/><path d="M213.22867460944823 457.9313175321682 L219.0 469.58 L224.77132539055177 457.9313175321682 Z" fill="#315f97"/><rect x="64" y="489.58" width="310" height="110" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="82" y="525.5799999999999" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">암호문(Ciphertext)</text><text x="64" y="637.5799999999999" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">내용을 숨김. 적절한 복호화(</text><text x="64" y="671.66" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">Decryption)로 원문을 복원.</text><rect x="425" y="145.44" width="350" height="654.72" rx="12" fill="#fff" stroke="#28766a" stroke-width="2"/><text x="445" y="185.44" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#28766a" text-anchor="start">해시(Cryptographic</text><text x="445" y="223.78" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#28766a" text-anchor="start">Hash)</text><rect x="445" y="287.12" width="310" height="100" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="463" y="323.12" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">문서(Message)</text><text x="600.0" y="422.12" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="400" fill="#28766a" text-anchor="middle">해시 함수</text><path d="M600.0,457.9 L600.0,507.9" fill="none" stroke="#28766a" stroke-width="3"/><path d="M594.2286746094483 496.2713175321682 L600.0 507.92 L605.7713253905517 496.2713175321682 Z" fill="#28766a"/><rect x="445" y="527.9200000000001" width="310" height="110" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="463" y="563.9200000000001" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">고정 길이 요약(Digest)</text><text x="445" y="675.9200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">복호화용 키로 원문을</text><text x="445" y="710.0000000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">되찾는 처리로 설명하지</text><text x="445" y="744.08" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">않음.</text><rect x="806" y="145.44" width="350" height="654.72" rx="12" fill="#fff" stroke="#a45d30" stroke-width="2"/><text x="826" y="185.44" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#a45d30" text-anchor="start">전자서명(Digital</text><text x="826" y="223.78" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#a45d30" text-anchor="start">Signature)</text><rect x="826" y="287.12" width="310" height="100" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="844" y="323.12" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">문서 + A의 개인키</text><text x="981.0" y="422.12" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="400" fill="#a45d30" text-anchor="middle">서명(Sign)</text><path d="M981.0,457.9 L981.0,507.9" fill="none" stroke="#a45d30" stroke-width="3"/><path d="M975.2286746094483 496.2713175321682 L981.0 507.92 L986.7713253905517 496.2713175321682 Z" fill="#a45d30"/><rect x="826" y="527.9200000000001" width="310" height="110" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="844" y="563.9200000000001" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">서명값(Signature)</text><text x="826" y="675.9200000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">문서·서명·신뢰된 A 공개키로</text><text x="826" y="710.0000000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">검증(Verify). 출처·무결성</text><text x="826" y="744.08" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">확인.</text><text x="44" y="879.1600000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">공개 문서의 서명이 유효해도 내용은 비밀이 아닙니다. 해시나 검증키를 받은 경로의 신뢰도도 확인해야</text><text x="44" y="913.2400000000001" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">합니다.</text><text x="44" y="1009.32" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">서명 검증에는 검증키의 진위를 확인한 신뢰 경로가 필요합니다.</text></svg>