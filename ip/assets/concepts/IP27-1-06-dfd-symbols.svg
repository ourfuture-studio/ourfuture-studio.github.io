<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>자료흐름도(DFD, Data Flow Diagram)의 기호</title><desc>Yourdon/DeMarco 표기 예시에서 처리는 원, 자료 흐름은 이름 붙은 화살표, 자료 저장소는 평행선, 외부 개체는 사각형이다. 신청 데이터를 접수에서 저장소와 검증 처리로 전달한다. 실행 순서는 표현하지 않는다.</desc><rect width="100%" height="100%" fill="#fbfcfd" /><text x="44" y="34.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="start">IP27-1-06 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">자료흐름도(DFD, Data Flow Diagram)의 기호</text><circle cx="150" cy="190" r="52" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="150" y="198.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">처리</text><path d="M370,190 L530,190" fill="none" stroke="#203d43" stroke-width="3" /><path d="M530.00,190.00 L515.59,196.96 L515.59,183.04 Z" fill="#203d43" /><text x="450" y="175.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">데이터 이름</text><path d="M660,160 L840,160" fill="none" stroke="#203d43" stroke-width="3" /><path d="M660,220 L840,220" fill="none" stroke="#203d43" stroke-width="3" /><text x="750" y="198.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">파일</text><rect x="970" y="150" width="160" height="80" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="1050.0" y="197.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">외부 개체</text><text x="150" y="280.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">처리</text><text x="150" y="306.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">process</text><text x="450" y="280.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">자료 흐름</text><text x="450" y="306.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">data flow</text><text x="750" y="280.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">자료 저장소</text><text x="750" y="306.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">data store</text><text x="1050" y="280.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">단말</text><text x="1050" y="306.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">external entity</text><path d="M44,336 L1156,336" fill="none" stroke="#c9d6da" stroke-width="1" /><text x="44" y="380.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="400" fill="#617b82" text-anchor="start">예: 접수 서비스</text><rect x="60" y="470" width="180" height="90" rx="8" fill="#fbf1e8" stroke="#a45d30" stroke-width="2" /><text x="150.0" y="522.7" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#203d43" text-anchor="middle">신청자</text><circle cx="480" cy="515" r="70" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="480" y="507.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">1.0</text><text x="480" y="535.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">접수</text><circle cx="900" cy="515" r="70" fill="#edf7f2" stroke="#28766a" stroke-width="2" /><text x="900" y="507.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#617b82" text-anchor="middle">2.0</text><text x="900" y="535.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="24" font-weight="700" fill="#203d43" text-anchor="middle">검증</text><path d="M240,515 L405,515" fill="none" stroke="#203d43" stroke-width="3" /><path d="M405.00,515.00 L390.59,521.96 L390.59,508.04 Z" fill="#203d43" /><text x="322" y="500.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">신청 데이터</text><path d="M550,515 L825,515" fill="none" stroke="#203d43" stroke-width="3" /><path d="M825.00,515.00 L810.59,521.96 L810.59,508.04 Z" fill="#203d43" /><text x="688" y="500.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">접수 건</text><path d="M410,640 L600,640" fill="none" stroke="#203d43" stroke-width="3" /><path d="M410,690 L600,690" fill="none" stroke="#203d43" stroke-width="3" /><text x="505" y="673.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#203d43" text-anchor="middle">D1 신청 파일</text><path d="M480,587 L480,636" fill="none" stroke="#203d43" stroke-width="3" /><path d="M480.00,636.00 L473.04,621.59 L486.96,621.59 Z" fill="#203d43" /><text x="560" y="618.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#203d43" text-anchor="middle">신청 데이터</text><rect x="800" y="630" width="300" height="76" rx="8" fill="#edf4fb" stroke="#315f97" stroke-width="1" stroke-dasharray="8 6" /><text x="950" y="662.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#315f97" text-anchor="middle">실행 순서·시각은</text><text x="950" y="688.0" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="400" fill="#315f97" text-anchor="middle">DFD로 표현하지 않음</text></svg>