<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"><title>REDO·UNDO의 값 변화 추적</title><desc>장애 디스크X10·Y27에서 모든 갱신을 REDO하면 X14·Y27이 되고, 미완료 T2를 UNDO하면 X14·Y20이 된다. T1은 커밋하고 T2는 미완료다.</desc><rect width="100%" height="100%" fill="#fbfcfd"/><text x="44" y="34" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#617b82" text-anchor="start">IP27-2-23 · 개념을 관계로 보기</text><text x="44" y="82.0" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#203d43" text-anchor="start">REDO·UNDO의 값 변화 추적</text><rect x="44" y="145.44" width="1112" height="114" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="62" y="181.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">고정한 로그 모형(Log-based Recovery)</text><text x="62" y="227.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">T1: X 10→14 후 COMMIT / T2: Y 20→27 후 미완료</text><rect x="44" y="283.44" width="326" height="170" rx="12" fill="#fff4e9" stroke="#a45d30" stroke-width="2"/><text x="62" y="319.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#a45d30" text-anchor="start">장애 시 디스크</text><text x="62" y="365.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">X 10 / Y 27</text><rect x="425" y="283.44" width="326" height="170" rx="12" fill="#edf4fb" stroke="#315f97" stroke-width="2"/><text x="443" y="319.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#315f97" text-anchor="start">모든 갱신 REDO</text><text x="443" y="365.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">X 14 / Y 27</text><rect x="806" y="283.44" width="326" height="170" rx="12" fill="#edf7f2" stroke="#28766a" stroke-width="2"/><text x="824" y="319.44" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#28766a" text-anchor="start">미완료 T2 UNDO</text><text x="824" y="365.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">X 14 / Y 20</text><path d="M376.0,368.4 L419.0,368.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M407.3513175321682 374.21132539055174 L419 368.44 L407.3513175321682 362.66867460944826 Z" fill="#315f97"/><path d="M757.0,368.4 L800.0,368.4" fill="none" stroke="#315f97" stroke-width="3"/><path d="M788.3513175321682 374.21132539055174 L800 368.44 L788.3513175321682 362.66867460944826 Z" fill="#315f97"/><text x="44" y="497.44" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">REDO는 새 값(New Value)을 재현하고 UNDO는 이전 값(Old Value)을 복원합니다. 모든 복구 제품이 이</text><text x="44" y="531.52" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#203d43" text-anchor="start">두 단계만 수행한다는 뜻은 아닙니다.</text><text x="44" y="627.6" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#315f97" text-anchor="start">REDO 대상·UNDO 대상·순서는 문제에 명시한 복구 모형에서 정합니다.</text></svg>